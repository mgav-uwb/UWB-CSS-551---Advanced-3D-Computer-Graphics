  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">
  <!-- lib.css is REQUIRED for any deck hosting a data-demo host (else the
       cockpit layout collapses past the 700px slide budget). -->
  <link rel="stylesheet" href="../../lib/core/lib.css">

  <style>
    :root { --accent: #00b46e; }
    .reveal { font-size: 34px; }
    .reveal h2 { color: #1c2530; }
    .reveal h3 { color: var(--accent); }
    .reveal section small { color: #66708a; }
    .reveal table { font-size: 0.78em; }
    .reveal pre { width: 100%; box-shadow: none; font-size: 0.52em; }
    .reveal pre code { border-radius: 8px; }
    .reveal blockquote { width: 92%; }

    /* Demo-embed layout (playbook §4 / tools/_fixture-deck): keep the cube
       viewport + matrix panel side by side and CROP the viewport so the slide
       stays inside reveal's 700px height budget. The canvas pixel buffer is
       untouched, so the harness probe still reads a full-resolution render;
       only the on-slide footprint shrinks. */
    [data-demo] { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: center; }
    [data-demo] .demo-controls { flex: 1 1 100%; max-width: 460px; margin: 0 auto; }
    [data-demo] .demo-viewport { height: 200px !important; overflow: hidden; }
    [data-demo] canvas { height: 200px !important; width: auto !important; }
    /* fallback shows only when the live demo failed to build */
    .reveal .viz-fallback { font-size: 0.6em; text-align: left; }

    /* overview register: hide the demos' readout/matrix cards in this deck , 
       illumination's N·L/R·V card (per the design), and by the same rationale
       projection's matrix, scene-graph's matrix, and raster's pixel table:
       L01 is the no-math overview. lod, bump-map, mesh-view, and our-scene
       are exempt: their readouts (lod's exact triangle ladder, bump-map's
       "triangles: 2", mesh-view's vertex/triangle counts, our-scene's stage
       name + scene triangle count) are scale FACTS, not math, and are the
       pedagogical point of those slides. Later decks keep them all. */
    [data-demo]:not([data-demo="lod"]):not([data-demo="bump-map"]):not([data-demo="mesh-view"]):not([data-demo="our-scene"]) .demo-shell-card:has(.mat-panel) { display: none; }

    /* v2 full-slide demo exhibits: slides tagged with
       <!-- .slide: class="demo-full" --> hold ONLY a short ## title + the
       embed, the demo IS the slide. Override the 200px teaser crop above
       (same !important, higher specificity): viewport ~520px tall, rail full
       height beside it, whole exhibit capped at 560px so title + demo stay
       inside reveal's 700px slide budget. Any embed NOT on a demo-full slide
       keeps the 200px default crop. */
    .reveal section.demo-full h2 { font-size: 1.1em; margin-bottom: 8px; }
    section.demo-full [data-demo] { display: block; }
    section.demo-full [data-demo] .demo-shell-root--embed { max-width: 96%; max-height: 560px; }
    section.demo-full [data-demo] .demo-shell-scene--embed { min-height: 520px; }
    /* rail widened from the embed default 190px so our-scene's readout rows
       (stage name, scene triangle count) don't wrap mid-number */
    section.demo-full [data-demo] .demo-shell-rail--embed { max-height: 520px; flex: 0 0 230px; }
    section.demo-full [data-demo] .demo-viewport,
    section.demo-full [data-demo] canvas { height: 520px !important; width: auto !important; }
    /* curated media slides */
    .reveal .media-shot { max-height: 420px; width: auto; }
    .reveal .credit { display: block; font-size: 12px; color: #8b93a7; margin-top: 4px; }

    /* History decks: Dense named-not-explained slides: text beside a picture, a cost box,
       a footer of organizations, three-up application grids, timeline crops. */
    .reveal h2 { font-size: 1.22em; margin-bottom: 14px; }
    .reveal .cols { display: flex; gap: 22px; align-items: flex-start; text-align: left; }
    .reveal .cols .txt { flex: 1 1 57%; min-width: 0; font-size: 0.58em; line-height: 1.32; }
    .reveal .cols .txt p { margin: 0 0 8px 0; }
    .reveal .cols .txt ul { margin: 0 0 0 1em; }
    .reveal .cols .txt li { margin-bottom: 5px; }
    .reveal .cols .pic { flex: 1 1 43%; min-width: 0; text-align: center; }
    .reveal .cols .pic img { max-height: 330px; max-width: 100%; width: auto; display: block; margin: 0 auto; }
    .reveal .cols .pic .credit { margin-bottom: 8px; }
    /* stacked variant: image across the full width, text below it */
    .reveal .cols.stack { flex-direction: column; gap: 6px; }
    .reveal .cols.stack .pic { order: -1; width: 100%; }
    .reveal .cols.stack .pic img { width: 100%; max-height: 190px; object-fit: contain; }
    .reveal .cols.stack .txt { width: 100%; }
    /* stacked, two images side by side above the text */
    .reveal .cols.stack .pic.duo { display: flex; gap: 16px; justify-content: center; align-items: flex-end; }
    .reveal .cols.stack .pic.duo > div { min-width: 0; flex: 0 1 auto; }
    .reveal .cols.stack .pic.duo img { width: auto; max-width: 100%; max-height: 170px; }
    .reveal .cost { display: block; background: #f2f6f4; border-left: 4px solid var(--accent); padding: 5px 9px; margin-top: 8px; }
    .reveal .orgs { display: block; font-size: 15px; color: #4b5568; margin-top: 10px; text-align: left; border-top: 1px solid #d6dae3; padding-top: 5px; }
    .reveal .wide { font-size: 0.6em; text-align: left; line-height: 1.35; }
    .reveal .grid3 { display: flex; gap: 16px; text-align: left; font-size: 0.53em; line-height: 1.3; }
    .reveal .grid3 > div { flex: 1 1 0; min-width: 0; }
    .reveal .grid3 img { height: 200px; width: auto; max-width: 100%; object-fit: contain; display: block; margin: 0 auto; }
    .reveal .grid3 .credit { text-align: center; margin-bottom: 6px; }
    .reveal .grid3 p { margin: 0; }
    .reveal .map { overflow: hidden; width: 940px; margin: 0 auto; }
    .reveal .map img, .reveal .map-axis img { width: 940px; max-width: none; max-height: none; margin: 0; display: block; }
    .reveal .map-axis { overflow: hidden; width: 940px; height: 36px; margin: 0 auto; }
    .reveal .map-axis img { margin-top: -1261px; }
    .reveal .figslide img { max-height: 470px; max-width: 100%; width: auto; }
    .reveal .pipefig img { width: 100%; max-height: 300px; margin: 0 0 6px 0; }
    .reveal .films { font-size: 0.82em; }
    .reveal .films table { margin-bottom: 14px; }
    .reveal .filmrow img { width: auto; margin: 0 auto; display: block; }
    .reveal .filmrow { display: flex; gap: 12px; justify-content: center; align-items: flex-end; }
    .reveal .filmrow > div { min-width: 0; }

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>

  <script type="module">
    import { initDeckDemos } from '../../lib/deck.js';

    Reveal.initialize({
      hash: true,
      slideNumber: "c/t",
      transition: "slide",
      plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
    }).then(() => {
      // Markdown slides exist in the DOM only after init resolves: build the
      // embedded [data-demo] hosts now (never on DOMContentLoaded).
      initDeckDemos();

      // Demo slider focus vs. deck navigation: when a demo's range input is set
      // PROGRAMMATICALLY (the verify-deck harness's slider.fill, which focuses
      // the element), the slider keeps DOM focus, so reveal's ArrowRight is
      // swallowed by the slider instead of advancing the deck, so the walk gets
      // pinned on the demo slide. Blur demo sliders after a NON-interactive
      // input so navigation keys reach reveal again. Live mouse-drag (pointer
      // down) and keyboard fine-tuning (key held) are preserved untouched.
      document.querySelectorAll('[data-demo] input[type=range]').forEach((el) => {
        let pointerDown = false, kbd = false;
        el.addEventListener('pointerdown', () => { pointerDown = true; });
        window.addEventListener('pointerup', () => { pointerDown = false; });
        el.addEventListener('keydown', () => { kbd = true; });
        el.addEventListener('keyup', () => { kbd = false; });
        el.addEventListener('input', () => { if (!pointerDown && !kbd) el.blur(); });
      });
    });
  </script>
