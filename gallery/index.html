<!DOCTYPE html>
<!-- CSS 551 gallery: every picture and comic of the hub's strip in one grid, with a lightbox that shows
     each one large with its facts, sources and credit. Data: lib/site-extras.js (ICON_POOL, loadPool) and
     lib/site-data*.js; credits in media/icons/CREDITS.md and media/comics/CREDITS.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS 551 · Gallery</title>
<style>
  :root{ --ink:#2d2640; --dim:#6c6584; --line:#e9def8; --accent:#7a58d6; }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       padding:28px clamp(14px,4vw,56px) 64px;
       background:radial-gradient(900px 520px at 8% -6%, #ffe3ef 0%, transparent 60%),
                  radial-gradient(760px 480px at 96% 4%, #dff4ff 0%, transparent 62%),
                  radial-gradient(900px 700px at 50% 108%, #e8fbef 0%, transparent 60%), #fcf8ff;
       background-attachment:fixed}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:14px}
  h1{font-size:28px;margin:0;background:linear-gradient(90deg,#d0508a,#7a58d6 55%,#1c8766);-webkit-background-clip:text;background-clip:text;color:transparent}
  .meta{color:var(--dim);font-size:13.5px}
  a{color:var(--accent)}
  .filters{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
  .filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 14px;font-size:13px;color:var(--ink);cursor:pointer}
  .filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:#fff;padding:8px;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .card:hover,.card:focus-visible{border-color:var(--accent);outline:none}
  .card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#f6f0ff}
  .card.comic img{object-fit:contain;background:#fff}
  .card b{font-size:13.5px;margin-top:6px;line-height:1.3}
  .card span{font-size:12px;color:var(--dim)}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:0 7px;margin-top:4px;width:max-content}
  .tag.comic{background:#fff0f6;color:#c2457e} .tag.pic{background:#eafaf2;color:#1c8766}
  dialog{border:none;border-radius:16px;padding:0;max-width:min(760px,94vw);width:100%;box-shadow:0 20px 60px #3a2f5550}
  dialog::backdrop{background:#2d264066}
  .lb{padding:14px 18px 16px;max-height:88vh;overflow:auto}
  .lb-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .lb-h b{font-size:16px} .lb-h .sub{color:var(--dim);font-size:13px}
  .lb-h .btns{margin-left:auto;display:flex;gap:6px}
  .lb-h button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 11px;font-size:13px;color:var(--accent);cursor:pointer}
  .lb-h button:hover{background:#f4edff}
  .lb img,.lb video{display:block;max-width:100%;max-height:60vh;margin:0 auto;border-radius:10px}
  .lb ul{margin:12px 0 0;padding-left:20px} .lb li{margin:6px 0;font-size:14px}
  .src{display:block;font-size:11.5px;color:#8d86a3}
  .alt{font-style:italic;color:var(--dim);margin:10px 0 0}
  .credit{font-size:12px;color:#8d86a3;margin-top:8px}
  footer{margin-top:30px;color:var(--dim);font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>Gallery</h1>
  <div class="meta"><a href="../index.html">course hub</a> · <span id="count"></span> · click any picture for its story</div>
</header>
<div class="filters" role="group" aria-label="filter">
  <button type="button" data-f="all" aria-pressed="true">All</button>
  <button type="button" data-f="pic" aria-pressed="false">Pictures</button>
  <button type="button" data-f="comic" aria-pressed="false">Comics</button>
</div>
<div id="grid"></div>

<dialog id="lb"><div class="lb" id="lbc"></div></dialog>

<footer>
  Pictures: renders made for this course, and freely licensed film and game stills (<a href="../media/icons/CREDITS.md">credits</a>).
  Comics: xkcd by Randall Munroe, CC BY-NC 2.5 (<a href="../media/comics/CREDITS.md">credits</a>).
</footer>

<script type="module">
import { loadPool, comicItem } from '../lib/site-extras.js?v=11';
import { COMICS } from '../lib/site-data.js';

const base = '../';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const srcHTML = (src) => {
  const str = String(src || '');
  const urls = str.match(/https?:\/\/[^\s;,)]+[^\s;,.)]/g) || [];
  const text = esc(urls.reduce((t, u) => t.replace(u, ''), str).replace(/\(\s*\)/g, '').replace(/^[\s;,·:]+|[\s;,·:(]+$/g, ''));
  const links = urls.map((u) => { let h = u; try { h = new URL(u).hostname.replace(/^www\./, ''); } catch {} return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(h)}</a>`; });
  return [text, ...links].filter(Boolean).join(' · ');
};

const pics = await loadPool();
const items = [...pics, ...COMICS.map(comicItem)];
document.getElementById('count').textContent = `${pics.length} pictures and ${COMICS.length} comics`;

let filter = 'all', shown = [], cur = -1;
const grid = document.getElementById('grid');
const draw = () => {
  shown = items.filter((it) => filter === 'all' || it.kind === filter);
  grid.innerHTML = shown.map((it, i) => `<button type="button" class="card ${it.kind}" data-i="${i}">
    <img src="${base}${esc(it.img)}" alt="" loading="lazy">
    <b>${esc(it.title)}</b><span>${it.kind === 'comic' ? `xkcd #${it.num}` : esc(it.sub || '')}</span>
    <span class="tag ${it.kind}">${it.kind === 'comic' ? 'comic' : (it.video ? '▶ video' : 'picture')}</span></button>`).join('');
  grid.querySelectorAll('.card').forEach((c) => c.onclick = () => open(+c.dataset.i));
};
document.querySelectorAll('.filters button').forEach((b) => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll('.filters button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  draw();
});

const dlg = document.getElementById('lb'), box = document.getElementById('lbc');
function open(i) {
  cur = (i + shown.length) % shown.length;
  const it = shown[cur];
  const link = it.kind === 'comic' ? `https://xkcd.com/${it.num}/` : null;
  box.innerHTML = `
    <div class="lb-h"><b>${esc(it.title)}</b><span class="sub">${it.kind === 'comic' ? `xkcd #${it.num}` : esc(it.sub || '')}</span>
      <span class="btns"><button type="button" data-a="prev" aria-label="previous">‹</button><button type="button" data-a="next" aria-label="next">›</button>
      <button type="button" data-a="rand">another ↻</button><button type="button" data-a="close" aria-label="close">×</button></span></div>
    ${it.video ? `<video src="${base}${esc(it.video)}" poster="${base}${esc(it.img)}" controls autoplay muted loop playsinline></video>`
      : `${link ? `<a href="${link}" target="_blank" rel="noopener">` : ''}<img src="${base}${esc(it.img)}" alt="${esc(it.title)}">${link ? '</a>' : ''}`}
    ${it.kind === 'comic'
      ? `<p class="alt">${esc(it.alt)}</p><div class="credit"><a href="${link}" target="_blank" rel="noopener">xkcd</a> by Randall Munroe, <a href="https://creativecommons.org/licenses/by-nc/2.5/" target="_blank" rel="noopener">CC BY-NC 2.5</a></div>`
      : `${(it.facts || []).length ? `<ul>${it.facts.map((f) => `<li>${esc(f.t)} <span class="src">${srcHTML(f.src)}</span></li>`).join('')}</ul>` : ''}
         ${it.credit ? `<div class="credit">${esc(it.credit)}</div>` : ''}
         ${it.link ? `<div class="credit"><a href="${/^https?:/.test(it.link.url) ? esc(it.link.url) : base + esc(it.link.url)}" target="_blank" rel="noopener">${esc(it.link.label)}</a></div>` : ''}`}`;
  box.querySelector('[data-a=prev]').onclick = () => open(cur - 1);
  box.querySelector('[data-a=next]').onclick = () => open(cur + 1);
  box.querySelector('[data-a=rand]').onclick = () => { let j = cur; while (shown.length > 1 && j === cur) j = Math.floor(Math.random() * shown.length); open(j); };
  box.querySelector('[data-a=close]').onclick = () => dlg.close();
  if (!dlg.open) dlg.showModal();
}
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener('close', () => box.querySelector('video')?.pause());
document.addEventListener('keydown', (e) => {
  if (!dlg.open) return;
  if (e.key === 'ArrowRight') open(cur + 1);
  if (e.key === 'ArrowLeft') open(cur - 1);
});
draw();
</script>
</body>
</html>
