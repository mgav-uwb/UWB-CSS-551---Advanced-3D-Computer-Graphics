<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1c22"/></marker><marker id="ahd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5c6270"/></marker></defs><text x="20" y="24" font-size="12.5" font-weight="600">a .shader file, outside in, and which pipeline stage each part feeds</text><rect x="20" y="36" width="430" height="308" rx="6" fill="#f6f8fb" stroke="#d7dbe3"/><text x="30" y="54" font-family="ui-monospace, Menlo, monospace"  fill="#1a1c22" font-size="10">Shader "CSS551/Unlit" {</text><text x="30" y="68" font-family="ui-monospace, Menlo, monospace"  fill="#d98c1f" font-size="10">  Properties {</text><text x="30" y="82" font-family="ui-monospace, Menlo, monospace"  fill="#d98c1f" font-size="10">    _MainTex ("Texture", 2D) = "white" {}</text><text x="30" y="96" font-family="ui-monospace, Menlo, monospace"  fill="#d98c1f" font-size="10">    _Tint ("Tint", Color) = (1,1,1,1)</text><text x="30" y="110" font-family="ui-monospace, Menlo, monospace"  fill="#d98c1f" font-size="10">  }</text><text x="30" y="124" font-family="ui-monospace, Menlo, monospace"  fill="#1a1c22" font-size="10">  SubShader {</text><text x="30" y="138" font-family="ui-monospace, Menlo, monospace"  fill="#8a8f9a" font-size="10">    Cull Off  ZWrite On</text><text x="30" y="152" font-family="ui-monospace, Menlo, monospace"  fill="#1a1c22" font-size="10">    Pass {</text><text x="30" y="166" font-family="ui-monospace, Menlo, monospace"  fill="#6b40d8" font-size="10">      CGPROGRAM</text><text x="30" y="180" font-family="ui-monospace, Menlo, monospace"  fill="#6b40d8" font-size="10">      #pragma vertex vert</text><text x="30" y="194" font-family="ui-monospace, Menlo, monospace"  fill="#6b40d8" font-size="10">      #pragma fragment frag</text><text x="30" y="208" font-family="ui-monospace, Menlo, monospace"  fill="#6b40d8" font-size="10">      #include "UnityCG.cginc"</text><text x="30" y="222" font-family="ui-monospace, Menlo, monospace"  fill="#d98c1f" font-size="10">      sampler2D _MainTex; float4 _Tint;</text><text x="30" y="236" font-family="ui-monospace, Menlo, monospace"  fill="#1f5fb0" font-size="10">      struct appdata { float4 vertex:POSITION; float2 uv:TEXCOORD0; };</text><text x="30" y="250" font-family="ui-monospace, Menlo, monospace"  fill="#1f5fb0" font-size="10">      struct v2f { float4 pos:SV_POSITION; float2 uv:TEXCOORD0; };</text><text x="30" y="264" font-family="ui-monospace, Menlo, monospace"  fill="#1f5fb0" font-size="10">      v2f vert (appdata v) { ... }</text><text x="30" y="278" font-family="ui-monospace, Menlo, monospace"  fill="#0a7d5a" font-size="10">      fixed4 frag (v2f i) : SV_Target { ... }</text><text x="30" y="292" font-family="ui-monospace, Menlo, monospace"  fill="#6b40d8" font-size="10">      ENDCG</text><text x="30" y="306" font-family="ui-monospace, Menlo, monospace"  fill="#1a1c22" font-size="10">    }</text><text x="30" y="320" font-family="ui-monospace, Menlo, monospace"  fill="#1a1c22" font-size="10">  }</text><text x="30" y="334" font-family="ui-monospace, Menlo, monospace"  fill="#1a1c22" font-size="10">}</text><line x1="452" y1="76" x2="474" y2="76" stroke="#d98c1f" stroke-width="1.3" marker-end="url(#ah)" /><text x="480" y="80" font-size="10.5" fill="#d98c1f">exposed in the Inspector; set from C# by Material.Set*</text><line x1="452" y1="138" x2="474" y2="138" stroke="#8a8f9a" stroke-width="1.3" marker-end="url(#ah)" /><text x="480" y="142" font-size="10.5" fill="#8a8f9a">fixed-function state: culling, depth, blending</text><line x1="452" y1="166" x2="474" y2="166" stroke="#6b40d8" stroke-width="1.3" marker-end="url(#ah)" /><text x="480" y="170" font-size="10.5" fill="#6b40d8">the two programs, in Cg/HLSL</text><line x1="452" y1="236" x2="474" y2="236" stroke="#1f5fb0" stroke-width="1.3" marker-end="url(#ah)" /><text x="480" y="240" font-size="10.5" fill="#1f5fb0">per-vertex input and the interpolated output</text><line x1="452" y1="264" x2="474" y2="264" stroke="#1f5fb0" stroke-width="1.3" marker-end="url(#ah)" /><text x="480" y="268" font-size="10.5" fill="#1f5fb0">vertex stage: object space to clip space</text><line x1="452" y1="278" x2="474" y2="278" stroke="#0a7d5a" stroke-width="1.3" marker-end="url(#ah)" /><text x="480" y="282" font-size="10.5" fill="#0a7d5a">fragment stage: one color per covered pixel</text><text x="480" y="320" font-size="10.5" fill="#5c6270">the stages are those of the rasterization</text><text x="480" y="334" font-size="10.5" fill="#5c6270">chapter; ShaderLab only names where your code goes</text>
</svg>
