<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="740" height="340" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="740" height="340" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1c22"/></marker><marker id="ahd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5c6270"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f5fb0"/></marker><marker id="aha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0a7d5a"/></marker></defs><rect x="20" y="20" width="150" height="44" rx="6" fill="#1a1c22" fill-opacity="0.12" stroke="#1a1c22" stroke-width="1.4"/><text x="95" y="40" text-anchor="middle" font-weight="600" font-size="12" fill="#1a1c22">Scene</text><text x="95" y="55" text-anchor="middle" font-size="10.5" fill="#5c6270">the root Object3D</text><line x1="95" y1="64" x2="95" y2="84" stroke="#5c6270" stroke-width="1.4" marker-end="url(#ahd)" /><rect x="20" y="86" width="150" height="44" rx="6" fill="#1f5fb0" fill-opacity="0.12" stroke="#1f5fb0" stroke-width="1.4"/><text x="95" y="106" text-anchor="middle" font-weight="600" font-size="12" fill="#1f5fb0">Object3D</text><text x="95" y="121" text-anchor="middle" font-size="10.5" fill="#5c6270">position, quaternion, scale</text><text x="180" y="102" font-size="10.5" fill="#5c6270">a transform and children:</text><text x="180" y="118" font-size="10.5" fill="#5c6270">matrixWorld = parent.matrixWorld · matrix</text><line x1="95" y1="130" x2="95" y2="150" stroke="#5c6270" stroke-width="1.4" marker-end="url(#ahd)" /><rect x="20" y="152" width="150" height="32" rx="6" fill="#0a7d5a" fill-opacity="0.12" stroke="#0a7d5a" stroke-width="1.4"/><text x="95" y="172" text-anchor="middle" font-weight="600" font-size="11.5" fill="#0a7d5a">Mesh</text><text x="180" y="172" font-size="10.5" fill="#5c6270">+ geometry, material</text><rect x="20" y="192" width="150" height="32" rx="6" fill="#6b40d8" fill-opacity="0.12" stroke="#6b40d8" stroke-width="1.4"/><text x="95" y="212" text-anchor="middle" font-weight="600" font-size="11.5" fill="#6b40d8">PerspectiveCamera</text><text x="180" y="212" font-size="10.5" fill="#5c6270">+ fov, aspect, near, far</text><rect x="20" y="232" width="150" height="32" rx="6" fill="#8a8f9a" fill-opacity="0.12" stroke="#8a8f9a" stroke-width="1.4"/><text x="95" y="252" text-anchor="middle" font-weight="600" font-size="11.5" fill="#8a8f9a">Group, Light</text><text x="180" y="252" font-size="10.5" fill="#5c6270">grouping; light sources</text><rect x="470" y="150" width="130" height="40" rx="6" fill="#0a7d5a" fill-opacity="0.12" stroke="#0a7d5a" stroke-width="1.4"/><text x="535" y="168" text-anchor="middle" font-weight="600" font-size="12" fill="#0a7d5a">BufferGeometry</text><text x="535" y="183" text-anchor="middle" font-size="10.5" fill="#5c6270">attributes, index</text><rect x="610" y="150" width="120" height="40" rx="6" fill="#0a7d5a" fill-opacity="0.12" stroke="#0a7d5a" stroke-width="1.4"/><text x="670" y="168" text-anchor="middle" font-weight="600" font-size="12" fill="#0a7d5a">Material</text><text x="670" y="183" text-anchor="middle" font-size="10.5" fill="#5c6270">shader + uniforms</text><line x1="310" y1="168" x2="468" y2="170" stroke="#0a7d5a" stroke-width="1.4" marker-end="url(#aha)" /><path d="M 310 174 C 420 214, 600 214, 668 192" fill="none" stroke="#0a7d5a" stroke-width="1.4" marker-end="url(#aha)"/><rect x="470" y="250" width="260" height="44" rx="6" fill="#c0392b" fill-opacity="0.12" stroke="#c0392b" stroke-width="1.4"/><text x="600" y="270" text-anchor="middle" font-weight="600" font-size="12" fill="#c0392b">WebGLRenderer</text><text x="600" y="285" text-anchor="middle" font-size="10.5" fill="#5c6270">renderer.render(scene, camera)</text><text x="470" y="314" font-size="10.5" fill="#5c6270">draws every visible Mesh with its camera’s V and P</text><text x="470" y="30" font-size="11.5" font-weight="600" fill="#5c6270">in Unity</text><text x="470" y="50" font-family="ui-monospace, Menlo, monospace"  fill="#1a1c22" font-size="10.5">Scene</text><text x="580" y="50" font-size="10.5" fill="#5c6270">scene</text><text x="470" y="66" font-family="ui-monospace, Menlo, monospace"  fill="#1a1c22" font-size="10.5">Object3D</text><text x="580" y="66" font-size="10.5" fill="#5c6270">GameObject + Transform</text><text x="470" y="82" font-family="ui-monospace, Menlo, monospace"  fill="#1a1c22" font-size="10.5">Mesh</text><text x="580" y="82" font-size="10.5" fill="#5c6270">MeshFilter + MeshRenderer</text><text x="470" y="98" font-family="ui-monospace, Menlo, monospace"  fill="#1a1c22" font-size="10.5">Material</text><text x="580" y="98" font-size="10.5" fill="#5c6270">Material</text><text x="470" y="114" font-family="ui-monospace, Menlo, monospace"  fill="#1a1c22" font-size="10.5">WebGLRenderer</text><text x="580" y="114" font-size="10.5" fill="#5c6270">the engine’s render loop</text>
</svg>
