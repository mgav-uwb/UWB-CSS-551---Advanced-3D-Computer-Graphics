<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" width="700" height="310" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="700" height="310" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1c22"/></marker><marker id="ahd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5c6270"/></marker></defs><text x="20" y="24" font-size="12.5" font-weight="600">what reaches the shader, and from where</text><rect x="20" y="50" width="150" height="54" rx="6" fill="#1a1c22" fill-opacity="0.12" stroke="#1a1c22" stroke-width="1.4"/><text x="95" y="75" text-anchor="middle" font-weight="600" font-size="12" fill="#1a1c22">Mesh</text><text x="95" y="90" text-anchor="middle" font-size="10.5" fill="#5c6270">vertices, normals, uv</text><rect x="20" y="120" width="150" height="54" rx="6" fill="#d98c1f" fill-opacity="0.12" stroke="#d98c1f" stroke-width="1.4"/><text x="95" y="145" text-anchor="middle" font-weight="600" font-size="12" fill="#d98c1f">Material</text><text x="95" y="160" text-anchor="middle" font-size="10.5" fill="#5c6270">Properties values</text><rect x="20" y="190" width="150" height="54" rx="6" fill="#6b40d8" fill-opacity="0.12" stroke="#6b40d8" stroke-width="1.4"/><text x="95" y="215" text-anchor="middle" font-weight="600" font-size="12" fill="#6b40d8">C# script</text><text x="95" y="230" text-anchor="middle" font-size="10.5" fill="#5c6270">Shader.SetGlobal*</text><rect x="20" y="258" width="150" height="30" rx="6" fill="#8a8f9a" fill-opacity="0.12" stroke="#8a8f9a" stroke-width="1.4"/><text x="95" y="277" text-anchor="middle" font-weight="600" font-size="11" fill="#8a8f9a">Unity, per draw</text><rect x="260" y="50" width="180" height="54" rx="6" fill="#1f5fb0" fill-opacity="0.12" stroke="#1f5fb0" stroke-width="1.4"/><text x="350" y="75" text-anchor="middle" font-weight="600" font-size="12" fill="#1f5fb0">vert(appdata v)</text><text x="350" y="90" text-anchor="middle" font-size="10.5" fill="#5c6270">runs once per vertex</text><rect x="260" y="190" width="180" height="54" rx="6" fill="#0a7d5a" fill-opacity="0.12" stroke="#0a7d5a" stroke-width="1.4"/><text x="350" y="215" text-anchor="middle" font-weight="600" font-size="12" fill="#0a7d5a">frag(v2f i)</text><text x="350" y="230" text-anchor="middle" font-size="10.5" fill="#5c6270">runs once per covered pixel</text><rect x="520" y="190" width="160" height="54" rx="6" fill="#1a1c22" fill-opacity="0.12" stroke="#1a1c22" stroke-width="1.4"/><text x="600" y="215" text-anchor="middle" font-weight="600" font-size="12" fill="#1a1c22">SV_Target</text><text x="600" y="230" text-anchor="middle" font-size="10.5" fill="#5c6270">the framebuffer</text><rect x="520" y="50" width="160" height="54" rx="6" fill="#1a1c22" fill-opacity="0.12" stroke="#1a1c22" stroke-width="1.4"/><text x="600" y="75" text-anchor="middle" font-weight="600" font-size="12" fill="#1a1c22">clip position</text><text x="600" y="90" text-anchor="middle" font-size="10.5" fill="#5c6270">SV_POSITION</text><line x1="170" y1="77" x2="258" y2="77" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)" /><text x="214" y="70" text-anchor="middle" font-size="10" fill="#5c6270">attributes</text><line x1="170" y1="147" x2="258" y2="90" stroke="#d98c1f" stroke-width="1.3" marker-end="url(#ah)" /><line x1="170" y1="147" x2="258" y2="200" stroke="#d98c1f" stroke-width="1.3" marker-end="url(#ah)" /><text x="214" y="140" text-anchor="middle" font-size="10" fill="#d98c1f">uniforms</text><line x1="170" y1="217" x2="258" y2="217" stroke="#6b40d8" stroke-width="1.3" marker-end="url(#ah)" /><text x="214" y="232" text-anchor="middle" font-size="10" fill="#6b40d8">globals: matrices, light</text><line x1="170" y1="273" x2="258" y2="100" stroke="#8a8f9a" stroke-width="1.3" marker-end="url(#ah)" /><text x="176" y="300" font-size="10" fill="#8a8f9a">UNITY_MATRIX_M, _V, _P: built-in uniforms</text><line x1="350" y1="104" x2="350" y2="188" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)" /><text x="360" y="150" font-size="10" fill="#5c6270">v2f: interpolated by the</text><text x="360" y="163" font-size="10" fill="#5c6270">rasterizer across the triangle</text><line x1="440" y1="77" x2="518" y2="77" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)" /><line x1="440" y1="217" x2="518" y2="217" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)" />
</svg>
