<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="660" height="300" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1c22"/></marker><marker id="ahd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5c6270"/></marker></defs><rect x="20" y="30" width="120" height="44" rx="6" fill="#1a1c22" fill-opacity="0.12" stroke="#1a1c22" stroke-width="1.4"/><text x="80" y="50" text-anchor="middle" font-weight="600" font-size="12" fill="#1a1c22">Scene</text><text x="80" y="65" text-anchor="middle" font-size="10.5" fill="#5c6270">a file of objects</text><line x1="140" y1="52" x2="170" y2="52" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)" /><rect x="172" y="20" width="150" height="64" rx="6" fill="#1f5fb0" fill-opacity="0.12" stroke="#1f5fb0" stroke-width="1.4"/><text x="247" y="50" text-anchor="middle" font-weight="600" font-size="12" fill="#1f5fb0">GameObject</text><text x="247" y="65" text-anchor="middle" font-size="10.5" fill="#5c6270">a name and a list</text><text x="247" y="100" text-anchor="middle" font-size="10.5" fill="#5c6270">always has a</text><rect x="172" y="116" width="300" height="28" rx="6" fill="#0a7d5a" fill-opacity="0.12" stroke="#0a7d5a" stroke-width="1.4"/><text x="322" y="134" text-anchor="middle" font-weight="600" font-size="11.5" fill="#0a7d5a">Transform</text><text x="480" y="134" font-size="10.5" fill="#5c6270">position, rotation, scale; parent</text><line x1="247" y1="106" x2="247" y2="116" stroke="#5c6270" stroke-width="1.3" marker-end="url(#ahd)" /><rect x="172" y="150" width="300" height="28" rx="6" fill="#8a8f9a" fill-opacity="0.12" stroke="#8a8f9a" stroke-width="1.4"/><text x="322" y="168" text-anchor="middle" font-weight="600" font-size="11.5" fill="#8a8f9a">MeshFilter</text><text x="480" y="168" font-size="10.5" fill="#5c6270">which mesh</text><line x1="247" y1="144" x2="247" y2="150" stroke="#5c6270" stroke-width="1.3" marker-end="url(#ahd)" /><rect x="172" y="184" width="300" height="28" rx="6" fill="#8a8f9a" fill-opacity="0.12" stroke="#8a8f9a" stroke-width="1.4"/><text x="322" y="202" text-anchor="middle" font-weight="600" font-size="11.5" fill="#8a8f9a">MeshRenderer</text><text x="480" y="202" font-size="10.5" fill="#5c6270">which material (shader + values)</text><line x1="247" y1="178" x2="247" y2="184" stroke="#5c6270" stroke-width="1.3" marker-end="url(#ahd)" /><rect x="172" y="218" width="300" height="28" rx="6" fill="#8a8f9a" fill-opacity="0.12" stroke="#8a8f9a" stroke-width="1.4"/><text x="322" y="236" text-anchor="middle" font-weight="600" font-size="11.5" fill="#8a8f9a">Camera / Light</text><text x="480" y="236" font-size="10.5" fill="#5c6270">a view; a light source</text><line x1="247" y1="212" x2="247" y2="218" stroke="#5c6270" stroke-width="1.3" marker-end="url(#ahd)" /><rect x="172" y="252" width="300" height="28" rx="6" fill="#6b40d8" fill-opacity="0.12" stroke="#6b40d8" stroke-width="1.4"/><text x="322" y="270" text-anchor="middle" font-weight="600" font-size="11.5" fill="#6b40d8">YourScript : MonoBehaviour</text><text x="480" y="270" font-size="10.5" fill="#5c6270">Start(), Update(), public fields</text><line x1="247" y1="246" x2="247" y2="252" stroke="#5c6270" stroke-width="1.3" marker-end="url(#ahd)" /><text x="20" y="130" font-size="12" font-weight="600">Components</text><text x="20" y="148" font-size="10.5" fill="#5c6270">bolted onto the</text><text x="20" y="162" font-size="10.5" fill="#5c6270">object; the object</text><text x="20" y="176" font-size="10.5" fill="#5c6270">itself does nothing</text><text x="20" y="290" font-size="11" fill="#5c6270">a script is one more component; Unity calls its methods, you never call Update() yourself</text>
</svg>
