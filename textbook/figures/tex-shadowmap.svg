<rect x="40" y="30" width="280" height="280" fill="none" stroke="#d7dbe3"/><text x="40" y="325" text-anchor="middle" fill="#5c6270" font-size="11">-3</text><text x="110" y="325" text-anchor="middle" fill="#5c6270" font-size="11">-1.5</text><text x="180" y="325" text-anchor="middle" fill="#5c6270" font-size="11">0</text><text x="250" y="325" text-anchor="middle" fill="#5c6270" font-size="11">1.5</text><text x="320" y="325" text-anchor="middle" fill="#5c6270" font-size="11">3</text><text x="34" y="314" text-anchor="end" fill="#5c6270" font-size="11">-3</text><text x="34" y="244" text-anchor="end" fill="#5c6270" font-size="11">-1.5</text><text x="34" y="174" text-anchor="end" fill="#5c6270" font-size="11">0</text><text x="34" y="104" text-anchor="end" fill="#5c6270" font-size="11">1.5</text><text x="34" y="34" text-anchor="end" fill="#5c6270" font-size="11">3</text><text x="180" y="342" text-anchor="middle" fill="#5c6270">x</text><text transform="translate(0,170) rotate(-90)" text-anchor="middle" fill="#5c6270">z</text><text x="40" y="22" font-weight="600" font-size="13">the floor seen from above: the box and its shadow</text><polygon points="110,216.67 156.67,216.67 156.67,170 110,170" fill="#1a1c22" fill-opacity="0.25"/><rect x="156.67" y="146.67" width="46.67" height="46.67" fill="#d98c1f" fill-opacity="0.5" stroke="#1a1c22"/><circle cx="133.33" cy="193.33" r="4.5" fill="#c0392b" /><text x="140.33" y="198" font-size="10.5" fill="#c0392b">in shadow (-1, 0, -0.5)</text><circle cx="296.67" cy="170" r="4.5" fill="#0a7d5a" /><text x="289.67" y="153.67" font-size="10.5" fill="#0a7d5a" text-anchor="end">lit (2.5, 0, 0)</text><line x1="63.33" y1="286.67" x2="32.26" y2="302.2" stroke="#d98c1f" stroke-width="2"/><polygon points="26,305.33 30.38,298.45 34.14,305.96" fill="#d98c1f"/><text x="68" y="305.33" font-size="10" fill="#d98c1f">light direction (top view)</text><text x="345" y="70" font-size="11.5" font-weight="600">the shadow point (red):</text><text x="345" y="88" font-size="11">map stores 9.333 (the box top)</text><text x="345" y="106" font-size="11">its own depth is 10.833</text><text x="345" y="124" font-size="11" font-weight="600" fill="#c0392b">10.833 &gt; 9.333 + bias: shadow</text><text x="345" y="160" font-size="11.5" font-weight="600">the lit point (green):</text><text x="345" y="178" font-size="11">map stores 8.333, own depth 8.333</text><text x="345" y="196" font-size="11" fill="#0a7d5a">equal: lit, but only with a bias</text><text x="345" y="226" font-size="11" fill="#5c6270">floor depth changes 0.0131 per texel;</text><text x="345" y="242" font-size="11" fill="#5c6270">bias ≈ 1.5 texels = 0.0197</text>
