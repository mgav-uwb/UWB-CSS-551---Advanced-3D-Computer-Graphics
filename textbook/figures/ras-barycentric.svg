<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="640" height="350" fill="#ffffff"/>
<rect x="60" y="30" width="300" height="300" fill="none" stroke="#d7dbe3"/><text x="60" y="22" font-weight="600" font-size="13">Barycentric weights are area fractions</text><polygon points="197.5,167.5 323.05,186.37 168.32,72.54" fill="#c0392b" fill-opacity="0.25" stroke="#c0392b" stroke-width="1"/><polygon points="197.5,167.5 168.32,72.54 132.63,287.09" fill="#0a7d5a" fill-opacity="0.25" stroke="#0a7d5a" stroke-width="1"/><polygon points="197.5,167.5 132.63,287.09 323.05,186.37" fill="#1f5fb0" fill-opacity="0.25" stroke="#1f5fb0" stroke-width="1"/><polygon points="132.63,287.09 323.05,186.37 168.32,72.54" fill="none" stroke="#1a1c22" stroke-width="1.5"/><circle cx="132.63" cy="287.09" r="6" fill="#c0392b" /><text x="138.63" y="278.09" font-size="12" font-weight="600">v0</text><circle cx="323.05" cy="186.37" r="6" fill="#0a7d5a" /><text x="329.05" y="177.37" font-size="12" font-weight="600">v1</text><circle cx="168.32" cy="72.54" r="6" fill="#1f5fb0" /><text x="174.32" y="63.54" font-size="12" font-weight="600">v2</text><circle cx="197.5" cy="167.5" r="4" fill="#1a1c22" /><text x="203.5" y="182.5" font-size="12">P</text><text x="390" y="70" font-size="12" fill="#c0392b">w₀ = area(P, v1, v2) / area</text><text x="390" y="90" font-size="12" fill="#0a7d5a">w₁ = area(P, v2, v0) / area</text><text x="390" y="110" font-size="12" fill="#1f5fb0">w₂ = area(P, v0, v1) / area</text><text x="390" y="140" font-size="12">at P: (0.305, 0.259, 0.436)</text><text x="390" y="158" font-size="12">sum = 1.000</text><text x="390" y="188" font-size="11.5" fill="#5c6270">Each weight is 1 at its own vertex,</text><text x="390" y="204" font-size="11.5" fill="#5c6270">0 on the opposite edge, and varies</text><text x="390" y="220" font-size="11.5" fill="#5c6270">linearly in between: the edge functions</text><text x="390" y="236" font-size="11.5" fill="#5c6270">are these areas, up to the factor 2.</text>
</svg>
