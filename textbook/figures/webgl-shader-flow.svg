<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="700" height="320" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1c22"/></marker><marker id="ahd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5c6270"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f5fb0"/></marker><marker id="aha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0a7d5a"/></marker></defs><rect x="20" y="26" width="170" height="60" rx="6" fill="#0a7d5a" fill-opacity="0.12" stroke="#0a7d5a" stroke-width="1.4"/><text x="105" y="54" text-anchor="middle" font-weight="600" font-size="12" fill="#0a7d5a">BufferGeometry</text><text x="105" y="69" text-anchor="middle" font-size="10.5" fill="#5c6270">position, normal, uv</text><rect x="20" y="116" width="170" height="60" rx="6" fill="#6b40d8" fill-opacity="0.12" stroke="#6b40d8" stroke-width="1.4"/><text x="105" y="144" text-anchor="middle" font-weight="600" font-size="12" fill="#6b40d8">uniforms</text><text x="105" y="159" text-anchor="middle" font-size="10.5" fill="#5c6270">your { name: { value } }</text><rect x="20" y="206" width="170" height="60" rx="6" fill="#6b40d8" fill-opacity="0.12" stroke="#6b40d8" stroke-width="1.4"/><text x="105" y="234" text-anchor="middle" font-weight="600" font-size="12" fill="#6b40d8">three.js built-ins</text><text x="105" y="249" text-anchor="middle" font-size="10.5" fill="#5c6270">modelMatrix, viewMatrix, …</text><rect x="250" y="70" width="150" height="70" rx="6" fill="#1f5fb0" fill-opacity="0.12" stroke="#1f5fb0" stroke-width="1.4"/><text x="325" y="103" text-anchor="middle" font-weight="600" font-size="12" fill="#1f5fb0">vertex shader</text><text x="325" y="118" text-anchor="middle" font-size="10.5" fill="#5c6270">once per vertex</text><line x1="190" y1="56" x2="248" y2="92" stroke="#0a7d5a" stroke-width="1.4" marker-end="url(#aha)" /><line x1="190" y1="146" x2="248" y2="112" stroke="#6b40d8" stroke-width="1.4" marker-end="url(#ah)" /><line x1="190" y1="236" x2="248" y2="128" stroke="#6b40d8" stroke-width="1.4" marker-end="url(#ah)" /><text x="219" y="66" font-size="10" fill="#5c6270">attribute</text><text x="200" y="132" font-size="10" fill="#5c6270">uniform</text><rect x="250" y="196" width="150" height="60" rx="6" fill="#8a8f9a" fill-opacity="0.12" stroke="#8a8f9a" stroke-width="1.4"/><text x="325" y="224" text-anchor="middle" font-weight="600" font-size="12" fill="#8a8f9a">rasterizer</text><text x="325" y="239" text-anchor="middle" font-size="10.5" fill="#5c6270">interpolates varyings</text><line x1="325" y1="140" x2="325" y2="194" stroke="#1f5fb0" stroke-width="1.4" marker-end="url(#ahb)" /><text x="332" y="160" font-size="10" fill="#5c6270">gl_Position,</text><text x="332" y="174" font-size="10" fill="#5c6270">varyings</text><rect x="460" y="196" width="160" height="60" rx="6" fill="#c0392b" fill-opacity="0.12" stroke="#c0392b" stroke-width="1.4"/><text x="540" y="224" text-anchor="middle" font-weight="600" font-size="12" fill="#c0392b">fragment shader</text><text x="540" y="239" text-anchor="middle" font-size="10.5" fill="#5c6270">once per pixel</text><line x1="400" y1="226" x2="458" y2="226" stroke="#8a8f9a" stroke-width="1.4" marker-end="url(#ah)" /><line x1="190" y1="146" x2="458" y2="210" stroke="#6b40d8" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="4 3"/><rect x="460" y="70" width="160" height="70" rx="6" fill="#1a1c22" fill-opacity="0.12" stroke="#1a1c22" stroke-width="1.4"/><text x="540" y="103" text-anchor="middle" font-weight="600" font-size="12" fill="#1a1c22">framebuffer</text><text x="540" y="118" text-anchor="middle" font-size="10.5" fill="#5c6270">after depth test, blending</text><line x1="540" y1="196" x2="540" y2="142" stroke="#c0392b" stroke-width="1.4" marker-end="url(#ahr)" /><text x="548" y="176" font-size="10" fill="#5c6270">gl_FragColor</text><text x="20" y="296" font-size="10.5" fill="#5c6270">A ShaderMaterial gets the built-ins declared for it; a RawShaderMaterial gets nothing and declares everything itself.</text>
</svg>
