<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="640" height="440" fill="#ffffff"/>
<text x="20" y="24" fill="#1a1c22"  font-weight="600" font-size="14">Ray against plane: t = (D − n · o) / (n · d)</text><text x="20" y="44" fill="#5c6270" font-size="12.5" >Side view along the plane's normal: height = n · P.  Plane n · P = D = 0.333, n = (1, 2, 2)/3.</text><line x1="14" y1="271.67" x2="626" y2="271.67" stroke="#0a7d5a"  stroke-width="2.5"/><text x="626" y="265.67" fill="#0a7d5a" font-size="12.5" text-anchor="end" font-weight="600">plane  n · P = D</text><line x1="14" y1="300" x2="626" y2="300" stroke="#d7dbe3"  stroke-width="1" stroke-dasharray="3 4"/><text x="626" y="314" fill="#5c6270" font-size="12.5" text-anchor="end">height 0 (the origin)</text><line x1="70" y1="130" x2="70" y2="262.67" stroke="#1f5fb0"  stroke-width="2.8"/><polygon points="70,271.67 65.95,262.67 74.05,262.67" fill="#1f5fb0"/><circle cx="70" cy="271.67" r="4.5" fill="#1a1c22"/><text x="78" y="263.67" fill="#1a1c22" font-size="12.5" font-weight="600">hit (foot)</text><circle cx="70" cy="130" r="4" fill="#1f5fb0"/><text x="78" y="122" fill="#1f5fb0" font-size="12.5" font-weight="600">o</text><text x="70" y="340" fill="#1f5fb0" font-size="12.5" ></text><line x1="230" y1="300" x2="297" y2="274.83" stroke="#d98c1f"  stroke-width="2.8"/><polygon points="305.42,271.67 298.42,278.62 295.58,271.04" fill="#d98c1f"/><circle cx="305.42" cy="271.67" r="4.5" fill="#1a1c22"/><text x="313.42" y="263.67" fill="#1a1c22" font-size="12.5" font-weight="600">hit = Q</text><circle cx="230" cy="300" r="4" fill="#d98c1f"/><text x="238" y="320" fill="#d98c1f" font-size="12.5" font-weight="600">o</text><text x="230" y="340" fill="#d98c1f" font-size="12.5" ></text><line x1="345" y1="300" x2="464" y2="300" stroke="#6b40d8"  stroke-width="2.8"/><polygon points="473,300 464,304.05 464,295.95" fill="#6b40d8"/><text x="473" y="322" fill="#6b40d8" font-size="12.5" text-anchor="end" font-weight="600">never meets</text><circle cx="345" cy="300" r="4" fill="#6b40d8"/><text x="353" y="320" fill="#6b40d8" font-size="12.5" font-weight="600">o</text><text x="345" y="340" fill="#6b40d8" font-size="12.5" ></text><line x1="520" y1="130" x2="520" y2="71" stroke="#c0392b"  stroke-width="2.8"/><polygon points="520,62 524.05,71 515.95,71" fill="#c0392b"/><line x1="520" y1="130" x2="520" y2="271.67" stroke="#c0392b"  stroke-width="2" stroke-dasharray="5 4"/><circle cx="520" cy="271.67" r="4.5" fill="#1a1c22"/><text x="510" y="263.67" fill="#5c6270" font-size="12.5" text-anchor="end">the line hits here (t &lt; 0)</text><circle cx="520" cy="130" r="4" fill="#c0392b"/><text x="528" y="122" fill="#c0392b" font-size="12.5" font-weight="600">o</text><text x="520" y="340" fill="#c0392b" font-size="12.5" ></text><text x="14" y="352" fill="#1f5fb0" font-size="12.5" font-weight="600">1  d = −n</text><text x="14" y="369" fill="#1a1c22" font-size="12.5" >n · d = −1</text><text x="14" y="386" fill="#1a1c22" font-size="12.5" >t = 1.667</text><text x="14" y="403" fill="#1a1c22" font-size="12.5" >in front: hits the foot</text><text x="14" y="420" fill="#1a1c22" font-size="12.5" >(3.444, −0.111, −1.111)</text><text x="185" y="352" fill="#d98c1f" font-size="12.5" font-weight="600">2  d = (1, 0, 0)</text><text x="185" y="369" fill="#1a1c22" font-size="12.5" >n · d = 0.333</text><text x="185" y="386" fill="#1a1c22" font-size="12.5" >t = 1</text><text x="185" y="403" fill="#1a1c22" font-size="12.5" >hit (1, 0, 0) = Q</text><text x="185" y="420" fill="#1a1c22" font-size="12.5" >hits at a known point</text><text x="335" y="352" fill="#6b40d8" font-size="12.5" font-weight="600">3  d = (0, 1, −1)/√2</text><text x="335" y="369" fill="#1a1c22" font-size="12.5" >n · d = 0</text><text x="335" y="386" fill="#1a1c22" font-size="12.5" >t: divide by zero</text><text x="335" y="403" fill="#1a1c22" font-size="12.5" >parallel: never meets</text><text x="480" y="352" fill="#c0392b" font-size="12.5" font-weight="600">4  d = +n</text><text x="480" y="369" fill="#1a1c22" font-size="12.5" >n · d = 1</text><text x="480" y="386" fill="#1a1c22" font-size="12.5" >t = −1.667</text><text x="480" y="403" fill="#1a1c22" font-size="12.5" >plane is behind the origin:</text><text x="480" y="420" fill="#1a1c22" font-size="12.5" >a line hits, a ray does not</text><text x="14" y="330" fill="#5c6270" font-size="12.5" ></text>
</svg>
