<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="640" height="300" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1c22"/></marker></defs><text x="20" y="22" font-weight="600" font-size="13">Autoencoder: thing → code → thing</text><rect x="20" y="60" width="70" height="70" rx="6" fill="#1a1c22" fill-opacity="0.12" stroke="#1a1c22" stroke-width="1.4"/><text x="55" y="93" text-anchor="middle" font-weight="600" font-size="12" fill="#1a1c22">x</text><text x="55" y="108" text-anchor="middle" font-size="10.5" fill="#5c6270">512×512×3</text><line x1="90" y1="95" x2="120" y2="95" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><polygon points="120,45 200,80 200,110 120,145" fill="#1f5fb0" fill-opacity="0.12" stroke="#1f5fb0"/><text x="160" y="98" text-anchor="middle" font-weight="700" fill="#1f5fb0" font-size="14">E</text><rect x="210" y="78" width="50" height="34" rx="6" fill="#0a7d5a" fill-opacity="0.12" stroke="#0a7d5a" stroke-width="1.4"/><text x="235" y="93" text-anchor="middle" font-weight="600" font-size="12" fill="#0a7d5a">z</text><text x="235" y="108" text-anchor="middle" font-size="10.5" fill="#5c6270">64×64×4</text><line x1="200" y1="95" x2="210" y2="95" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><line x1="260" y1="95" x2="270" y2="95" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><polygon points="270,80 350,45 350,145 270,110" fill="#c0392b" fill-opacity="0.12" stroke="#c0392b"/><text x="310" y="98" text-anchor="middle" font-weight="700" fill="#c0392b" font-size="14">D</text><line x1="350" y1="95" x2="380" y2="95" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><rect x="380" y="60" width="70" height="70" rx="6" fill="#1a1c22" fill-opacity="0.12" stroke="#1a1c22" stroke-width="1.4"/><text x="415" y="93" text-anchor="middle" font-weight="600" font-size="12" fill="#1a1c22">D(E(x))</text><text x="415" y="108" text-anchor="middle" font-size="10.5" fill="#5c6270">≈ x</text><text x="20" y="160" fill="#5c6270" font-size="11.5">Trained so that D(E(x)) ≈ x. The narrow middle keeps 48× fewer numbers, so it must keep what matters.</text><text x="20" y="200" font-weight="600" font-size="13">Two encoders, one space (CLIP)</text><rect x="20" y="220" width="90" height="40" rx="6" fill="#1a1c22" fill-opacity="0.12" stroke="#1a1c22" stroke-width="1.4"/><text x="65" y="244" text-anchor="middle" font-weight="600" font-size="12" fill="#1a1c22">image</text><line x1="110" y1="240" x2="140" y2="240" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><rect x="140" y="220" width="70" height="40" rx="6" fill="#1f5fb0" fill-opacity="0.12" stroke="#1f5fb0" stroke-width="1.4"/><text x="175" y="244" text-anchor="middle" font-weight="600" font-size="12" fill="#1f5fb0">E_I</text><line x1="210" y1="240" x2="250" y2="240" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><rect x="20" y="270" width="90" height="26" rx="6" fill="#1a1c22" fill-opacity="0.12" stroke="#1a1c22" stroke-width="1.4"/><text x="65" y="287" text-anchor="middle" font-weight="600" font-size="12" fill="#1a1c22">"a tabby cat"</text><line x1="110" y1="283" x2="140" y2="283" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><rect x="140" y="266" width="70" height="34" rx="6" fill="#6b40d8" fill-opacity="0.12" stroke="#6b40d8" stroke-width="1.4"/><text x="175" y="287" text-anchor="middle" font-weight="600" font-size="12" fill="#6b40d8">E_T</text><line x1="210" y1="283" x2="250" y2="260" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><circle cx="300" cy="250" r="42" fill="#0a7d5a" fill-opacity="0.10" stroke="#0a7d5a" stroke-dasharray="4 3"/><text x="300" y="246" text-anchor="middle" fill="#0a7d5a" font-size="11">shared</text><text x="300" y="260" text-anchor="middle" fill="#0a7d5a" font-size="11">R^512</text><circle cx="286" cy="272" r="4" fill="#1f5fb0"/><circle cx="296" cy="278" r="4" fill="#6b40d8"/><text x="360" y="232" fill="#5c6270" font-size="11.5">Matching pairs are pulled together (high cosine),</text><text x="360" y="248" fill="#5c6270" font-size="11.5">mismatched pairs pushed apart, over a batch.</text><text x="360" y="272" fill="#5c6270" font-size="11.5">Afterwards a caption is a direction in image space:</text><text x="360" y="288" fill="#5c6270" font-size="11.5">"aim at this caption" is geometry.</text>
</svg>
