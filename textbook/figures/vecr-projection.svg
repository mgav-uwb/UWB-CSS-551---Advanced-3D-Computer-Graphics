<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="1000" height="330" fill="#ffffff"/>
<line x1="70.65" y1="262.73" x2="392.51" y2="262.73" stroke="#1f5fb0" stroke-width="2.6"/><polygon points="402.51,262.73 392.51,268.73 392.51,256.73" fill="#1f5fb0"/><text x="409.29" y="288.18" fill="#1f5fb0" font-size="15" font-weight="600">v</text><polyline fill="none" stroke="#0a7d5a"  stroke-linejoin="round" stroke-width="7" stroke-opacity="0.35" points="70.65,262.73 291.89,262.73"/><line x1="70.65" y1="262.73" x2="284.38" y2="74.92" stroke="#c0392b" stroke-width="2.6"/><polygon points="291.89,68.31 288.34,79.42 280.42,70.41" fill="#c0392b"/><text x="170.43" y="152.79" fill="#c0392b" font-size="15" font-weight="600" text-anchor="end">u, |u| = 2.236</text><polyline fill="none" stroke="#d98c1f"  stroke-linejoin="round" stroke-width="2" stroke-dasharray="6 4" points="291.89,262.73 291.89,68.31"/><text x="301.37" y="157.88" fill="#d98c1f" font-size="14">across: u-perp</text><text x="301.37" y="176.98" fill="#d98c1f" font-size="14">= u − u-along</text><polyline fill="none" stroke="#1a1c22"  stroke-linejoin="round" stroke-width="1.4" points="279.7,262.73 279.7,251.27 291.89,251.27"/><polyline fill="none" stroke="#1a1c22"  stroke-linejoin="round" stroke-width="2" points="122.13,262.73 122.12,261.82 122.09,260.91 122.05,260 121.98,259.09 121.9,258.19 121.8,257.28 121.68,256.38 121.55,255.48 121.39,254.58 121.22,253.69 121.03,252.8 120.82,251.91 120.6,251.02 120.36,250.14 120.1,249.27 119.82,248.4 119.52,247.53 119.21,246.67 118.88,245.82 118.53,244.97 118.17,244.12 117.79,243.29 117.39,242.46 116.98,241.64 116.55,240.82 116.1,240.02 115.64,239.22 115.16,238.43 114.66,237.65 114.15,236.87 113.63,236.11 113.09,235.35 112.53,234.61 111.96,233.87 111.38,233.15 110.78,232.44 110.17,231.73 109.54,231.04 108.9,230.36 108.24,229.69"/><text x="124.83" y="248.99" font-size="15" font-weight="600">θ</text><text x="181.27" y="290.73" fill="#0a7d5a" font-size="15" font-weight="600" text-anchor="middle">along: |u| cos θ = 1.633</text><circle cx="291.89" cy="262.73" r="4" fill="#0a7d5a"/><circle cx="491" cy="35" r="11" fill="#1a1c22"/><text x="491" y="40" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">1</text><text x="510" y="40" font-size="15" font-weight="600" fill="#1a1c22">the shadow is a right triangle's side</text><text x="510" y="62" font-size="14">u is the hypotenuse, so the shadow's length is |u| cos θ</text><circle cx="491" cy="99" r="11" fill="#1a1c22"/><text x="491" y="104" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">2</text><text x="510" y="104" font-size="15" font-weight="600" fill="#1a1c22">replace cos θ by the dot product</text><text x="510" y="126" font-size="14">|u| · (u · v) / (|u| |v|)  =  (u · v) / |v|</text><circle cx="491" cy="163" r="11" fill="#1a1c22"/><text x="491" y="168" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">3</text><text x="510" y="168" font-size="15" font-weight="600" fill="#1a1c22">point it along v</text><text x="510" y="190" font-size="14">the unit direction is v / |v|</text><circle cx="491" cy="227" r="11" fill="#0a7d5a"/><text x="491" y="232" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">4</text><text x="510" y="232" font-size="15" font-weight="600" fill="#0a7d5a">length times direction</text><text x="510" y="254" font-size="14">along = ((u · v) / |v|) (v / |v|)  =  ((u · v) / (v · v)) v</text><text x="510" y="284" font-size="14" fill="#5c6270">u = (2, 1, 0), v = (1, 2, 1):  4 / 6 = 2/3,  along = (2/3) v</text><text x="510" y="306" font-size="14" fill="#5c6270">shadow length 4 / √6 = 1.633;  across length |u| sin θ = 1.528</text>
</svg>
