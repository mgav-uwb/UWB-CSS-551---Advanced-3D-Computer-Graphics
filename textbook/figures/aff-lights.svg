<rect x="30" y="44.12" width="280" height="201.76" fill="none" stroke="#d7dbe3"/><text x="30" y="36.12" font-weight="600" font-size="12.5">w = 1: a point light, the rays spread</text><line x1="30" y1="233.53" x2="310" y2="233.53" stroke="#1a1c22" stroke-width="2"/><line x1="190.59" y1="233.53" x2="224.9" y2="233.53" stroke="#333" stroke-width="7"/><line x1="87.65" y1="68.82" x2="46.47" y2="233.53" stroke="#c98a12" stroke-width="1.2"/><line x1="87.65" y1="68.82" x2="87.65" y2="233.53" stroke="#c98a12" stroke-width="1.2"/><line x1="87.65" y1="68.82" x2="128.82" y2="233.53" stroke="#c98a12" stroke-width="1.2"/><line x1="87.65" y1="68.82" x2="252.35" y2="233.53" stroke="#c98a12" stroke-width="1.2"/><line x1="87.65" y1="68.82" x2="293.53" y2="233.53" stroke="#c98a12" stroke-width="1.2"/><line x1="87.65" y1="68.82" x2="224.9" y2="233.53" stroke="#c98a12" stroke-width="1.8" stroke-dasharray="5 3"/><polygon points="149.41,233.53 190.59,233.53 190.59,192.35 149.41,192.35" fill="#8a8f9a" fill-opacity="0.5" stroke="#8a8f9a" stroke-width="1.2" stroke-linejoin="round"/><text x="224.9" y="249.53" font-size="11" text-anchor="middle">shadow</text><circle cx="87.65" cy="68.82" r="9" fill="#c98a12"/><text x="101.65" y="72.82" font-size="12" font-weight="600" fill="#1a1c22">L = (1, 4, 1)</text><rect x="330" y="44.12" width="280" height="201.76" fill="none" stroke="#d7dbe3"/><text x="330" y="36.12" font-weight="600" font-size="12.5">w = 0: a directional light, the rays are parallel</text><line x1="330" y1="233.53" x2="610" y2="233.53" stroke="#1a1c22" stroke-width="2"/><line x1="490.59" y1="233.53" x2="511.18" y2="233.53" stroke="#333" stroke-width="7"/><line x1="330" y1="200.59" x2="346.47" y2="233.53" stroke="#c98a12" stroke-width="1.2"/><line x1="330" y1="118.24" x2="387.65" y2="233.53" stroke="#c98a12" stroke-width="1.2"/><line x1="350.59" y1="77.06" x2="428.82" y2="233.53" stroke="#c98a12" stroke-width="1.2"/><line x1="474.12" y1="77.06" x2="552.35" y2="233.53" stroke="#c98a12" stroke-width="1.2"/><line x1="515.29" y1="77.06" x2="593.53" y2="233.53" stroke="#c98a12" stroke-width="1.2"/><line x1="432.94" y1="77.06" x2="511.18" y2="233.53" stroke="#c98a12" stroke-width="1.8" stroke-dasharray="5 3"/><polygon points="449.41,233.53 490.59,233.53 490.59,192.35 449.41,192.35" fill="#8a8f9a" fill-opacity="0.5" stroke="#8a8f9a" stroke-width="1.2" stroke-linejoin="round"/><text x="511.18" y="249.53" font-size="11" text-anchor="middle">shadow</text><text x="354.71" y="60.47" font-size="12" font-weight="600" fill="#1a1c22">L = (−1, 2, 0)</text><text x="30" y="284" font-size="12" fill="#1a1c22">Same box, same code: the direction from a surface point p toward the light is L.xy − L.w · p.</text><text x="30" y="302" font-size="12" fill="#5c6270">With w = 1 that is L − p, which changes from point to point; with w = 0 it is L itself, everywhere (here (−1, 2)).</text><text x="30" y="320" font-size="12" fill="#5c6270">Shadow of the box's corner (3.5, 1): ends at x = 4.333 under the point light, x = 4 under the directional one.</text>
