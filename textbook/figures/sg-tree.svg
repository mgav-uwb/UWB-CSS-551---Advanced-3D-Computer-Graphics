<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 335" width="640" height="335" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="640" height="335" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1c22"/></marker></defs><rect x="160" y="0" width="240" height="34" rx="6" fill="#8a8f9a" fill-opacity="0.12" stroke="#8a8f9a" stroke-width="1.4"/><text x="280" y="21" text-anchor="middle" font-weight="600" font-size="12" fill="#8a8f9a">world (identity)</text><rect x="160" y="60" width="240" height="54" rx="6" fill="#1f5fb0" fill-opacity="0.12" stroke="#1f5fb0" stroke-width="1.4"/><text x="280" y="85" text-anchor="middle" font-weight="600" font-size="12" fill="#1f5fb0">base</text><text x="280" y="100" text-anchor="middle" font-size="10.5" fill="#5c6270">L_base = T(0, 0.2, 0)·R_y(baseRy)</text><text x="420" y="92" font-size="12" font-family="Menlo, monospace">W_base = L_base</text><rect x="160" y="150" width="240" height="54" rx="6" fill="#0a7d5a" fill-opacity="0.12" stroke="#0a7d5a" stroke-width="1.4"/><text x="280" y="175" text-anchor="middle" font-weight="600" font-size="12" fill="#0a7d5a">arm</text><text x="280" y="190" text-anchor="middle" font-size="10.5" fill="#5c6270">L_arm = T_joint·T_lift·R_bend·T_pivot</text><text x="420" y="182" font-size="12" font-family="Menlo, monospace">W_arm = W_base · L_arm</text><rect x="160" y="240" width="240" height="54" rx="6" fill="#c0392b" fill-opacity="0.12" stroke="#c0392b" stroke-width="1.4"/><text x="280" y="265" text-anchor="middle" font-weight="600" font-size="12" fill="#c0392b">hand</text><text x="280" y="280" text-anchor="middle" font-size="10.5" fill="#5c6270">L_hand = T(0, 0.7, 0)·R_y(handRy)</text><text x="420" y="272" font-size="12" font-family="Menlo, monospace">W_hand = W_arm · L_hand</text><line x1="280" y1="34" x2="280" y2="58" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><line x1="280" y1="114" x2="280" y2="148" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><line x1="280" y1="204" x2="280" y2="238" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><text x="20" y="320" font-size="11" fill="#5c6270">Each node stores one local transform, written in its parent's frame; its world transform is the product along the path from the root.</text>
</svg>
