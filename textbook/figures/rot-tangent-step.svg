<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="640" height="430" fill="#ffffff"/>
<circle cx="200" cy="215" r="70" fill="none" stroke="#8a8f9a" stroke-width="1.2"/><circle cx="200" cy="215" r="3" fill="#1a1c22"/><text x="200" y="309" font-size="12" fill="#5c6270" text-anchor="middle">ω points up, out of the page</text><polyline fill="none" stroke="#d98c1f" stroke-width="2" points="270,215 270,178.35 250.81,141.7 212.43,115.09 160.12,108.59 104.4,129.47 59.61,179.53"/><circle cx="270" cy="178.35" r="4" fill="#d98c1f"/><text x="277" y="172.35" font-size="12" fill="#d98c1f" font-weight="600" >1</text><circle cx="250.81" cy="141.7" r="4" fill="#d98c1f"/><text x="257.81" y="135.7" font-size="12" fill="#d98c1f" font-weight="600" >2</text><circle cx="212.43" cy="115.09" r="4" fill="#d98c1f"/><text x="219.43" y="109.09" font-size="12" fill="#d98c1f" font-weight="600" >3</text><circle cx="160.12" cy="108.59" r="4" fill="#d98c1f"/><text x="151.12" y="101.59" font-size="12" fill="#d98c1f" font-weight="600" text-anchor="end">4</text><circle cx="104.4" cy="129.47" r="4" fill="#d98c1f"/><text x="95.4" y="122.47" font-size="12" fill="#d98c1f" font-weight="600" text-anchor="end">5</text><circle cx="59.61" cy="179.53" r="4" fill="#d98c1f"/><text x="50.61" y="172.53" font-size="12" fill="#d98c1f" font-weight="600" text-anchor="end">6</text><circle cx="260.62" cy="180" r="4.5" fill="#12a5b8" stroke="#fff" stroke-width="1.2"/><circle cx="235" cy="154.38" r="4.5" fill="#12a5b8" stroke="#fff" stroke-width="1.2"/><circle cx="200" cy="145" r="4.5" fill="#12a5b8" stroke="#fff" stroke-width="1.2"/><circle cx="165" cy="154.38" r="4.5" fill="#12a5b8" stroke="#fff" stroke-width="1.2"/><circle cx="139.38" cy="180" r="4.5" fill="#12a5b8" stroke="#fff" stroke-width="1.2"/><circle cx="130" cy="215" r="4.5" fill="#12a5b8" stroke="#fff" stroke-width="1.2"/><circle cx="270" cy="215" r="5.5" fill="#1a1c22"/><text x="260" y="235" font-size="12" font-weight="600" text-anchor="end">p = (1, 0)</text><line x1="270" y1="215" x2="270" y2="185.35" stroke="#6b40d8" stroke-width="2.5"/><polygon points="270,178.35 265,188.35 275,188.35" fill="#6b40d8"/><text x="280" y="208.35" font-size="12" fill="#6b40d8" font-weight="600">v Δt = ω × p Δt</text><text x="280" y="224.35" font-size="12" fill="#6b40d8">(tangent)</text><text x="420" y="40" font-size="12" font-weight="600">step = 30° (ω Δt = 0.5236 rad)</text><circle cx="426" cy="64" r="5" fill="#12a5b8"/><text x="438" y="68" font-size="12" >exact: rotate p by ω Δt each step</text><circle cx="426" cy="86" r="5" fill="#d98c1f"/><text x="438" y="90" font-size="12" >linear: p ← p + (ω × p) Δt</text><text x="420" y="124" font-size="12" font-weight="600">each linear step multiplies</text><text x="420" y="142" font-size="12" font-weight="600">the length by √(1 + (ωΔt)²)</text><text x="420" y="160" font-size="12" font-weight="600">= 1.1288</text><text x="428" y="182" font-size="12" fill="#5c6270">step</text><text x="478" y="182" font-size="12" fill="#5c6270">linear length</text><text x="580" y="182" font-size="12" fill="#5c6270">exact</text><text x="428" y="204" font-size="12" fill="#d98c1f" font-weight="600">1</text><text x="500" y="204" font-size="12" fill="#d98c1f">1.129</text><text x="580" y="204" font-size="12" fill="#12a5b8">1.000</text><text x="428" y="223" font-size="12" fill="#d98c1f" font-weight="600">2</text><text x="500" y="223" font-size="12" fill="#d98c1f">1.274</text><text x="580" y="223" font-size="12" fill="#12a5b8">1.000</text><text x="428" y="242" font-size="12" fill="#d98c1f" font-weight="600">3</text><text x="500" y="242" font-size="12" fill="#d98c1f">1.438</text><text x="580" y="242" font-size="12" fill="#12a5b8">1.000</text><text x="428" y="261" font-size="12" fill="#d98c1f" font-weight="600">4</text><text x="500" y="261" font-size="12" fill="#d98c1f">1.623</text><text x="580" y="261" font-size="12" fill="#12a5b8">1.000</text><text x="428" y="280" font-size="12" fill="#d98c1f" font-weight="600">5</text><text x="500" y="280" font-size="12" fill="#d98c1f">1.833</text><text x="580" y="280" font-size="12" fill="#12a5b8">1.000</text><text x="428" y="299" font-size="12" fill="#d98c1f" font-weight="600">6</text><text x="500" y="299" font-size="12" fill="#d98c1f">2.069</text><text x="580" y="299" font-size="12" fill="#12a5b8">1.000</text><text x="420" y="346" font-size="12" fill="#5c6270">The velocity is tangent, so the</text><text x="420" y="364" font-size="12" fill="#5c6270">step always leaves the circle</text><text x="420" y="382" font-size="12" fill="#5c6270">and the radius compounds.</text><text x="20" y="398" font-size="12" fill="#5c6270">Spinning about the vertical axis, seen from above.</text><text x="20" y="416" font-size="12" fill="#5c6270">A step along the tangent cannot stay on the circle; rotate instead.</text>
</svg>
