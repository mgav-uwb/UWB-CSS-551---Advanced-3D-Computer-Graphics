<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="640" height="250" fill="#ffffff"/>
<text x="140" y="30" text-anchor="middle" font-size="12.5" font-weight="600">the text and its library: right-handed</text><line x1="140" y1="150" x2="220" y2="150" stroke="#c0392b" stroke-width="2.4"/><polygon points="220,150 212,146 212,154" fill="#c0392b"/><text x="228" y="154" font-size="11.5" fill="#c0392b" font-weight="600">x (right)</text><line x1="140" y1="150" x2="140" y2="70" stroke="#0a7d5a" stroke-width="2.4"/><polygon points="140,70 136,78 144,78" fill="#0a7d5a"/><text x="148" y="74" font-size="11.5" fill="#0a7d5a" font-weight="600">y (up)</text><line x1="140" y1="150" x2="101.5" y2="188.5" stroke="#1f5fb0" stroke-width="2.4"/><circle cx="101.5" cy="188.5" r="4" fill="#1f5fb0"/><text x="109.5" y="192.5" font-size="11.5" fill="#1f5fb0" font-weight="600">z (toward you)</text><text x="140" y="225" text-anchor="middle" font-size="10.5" fill="#5c6270">x × y = z, and z points out of the page</text><text x="460" y="30" text-anchor="middle" font-size="12.5" font-weight="600">Unity: left-handed, y up</text><line x1="460" y1="150" x2="540" y2="150" stroke="#c0392b" stroke-width="2.4"/><polygon points="540,150 532,146 532,154" fill="#c0392b"/><text x="548" y="154" font-size="11.5" fill="#c0392b" font-weight="600">x (right)</text><line x1="460" y1="150" x2="460" y2="70" stroke="#0a7d5a" stroke-width="2.4"/><polygon points="460,70 456,78 464,78" fill="#0a7d5a"/><text x="468" y="74" font-size="11.5" fill="#0a7d5a" font-weight="600">y (up)</text><line x1="460" y1="150" x2="498.5" y2="111.5" stroke="#1f5fb0" stroke-width="2.4"/><circle cx="498.5" cy="111.5" r="4" fill="#1f5fb0"/><text x="506.5" y="115.5" font-size="11.5" fill="#1f5fb0" font-weight="600">z (forward, away)</text><text x="460" y="225" text-anchor="middle" font-size="10.5" fill="#5c6270">x × y = z, and z points into the page</text><text x="320" y="245" text-anchor="middle" font-size="11">Vector3.Cross(right, up) = (0, 0, 1) in both; only which way +z is drawn differs</text>
</svg>
