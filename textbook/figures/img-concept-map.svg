<defs><marker id="ah2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5c6270"/></marker></defs><text x="20" y="22" font-weight="600" font-size="13">Image space  R^3mn</text><text x="430" y="22" font-weight="600" font-size="13">Concept space  R^d</text><rect x="20" y="34" width="300" height="170" rx="8" fill="#eceff4" stroke="#d7dbe3"/><path d="M 60 170 C 100 60, 180 200, 290 70" fill="none" stroke="#0a7d5a" stroke-width="3" stroke-opacity="0.5"/><text x="150" y="195" fill="#0a7d5a" font-size="11">the thin sheet of natural images</text><circle cx="80" cy="150" r="5" fill="#1f5fb0"/><line x1="86" y1="150" x2="470" y2="118" stroke="#5c6270" stroke-width="0.8" marker-end="url(#ah2)"/><circle cx="120" cy="118" r="5" fill="#1f5fb0"/><line x1="126" y1="118" x2="470" y2="118" stroke="#5c6270" stroke-width="0.8" marker-end="url(#ah2)"/><circle cx="160" cy="138" r="5" fill="#1f5fb0"/><line x1="166" y1="138" x2="470" y2="118" stroke="#5c6270" stroke-width="0.8" marker-end="url(#ah2)"/><circle cx="205" cy="112" r="5" fill="#1f5fb0"/><line x1="211" y1="112" x2="470" y2="118" stroke="#5c6270" stroke-width="0.8" marker-end="url(#ah2)"/><circle cx="250" cy="88" r="5" fill="#1f5fb0"/><line x1="256" y1="88" x2="470" y2="118" stroke="#5c6270" stroke-width="0.8" marker-end="url(#ah2)"/><text x="72" y="168" fill="#1f5fb0" font-size="11">five different cat photos</text><circle cx="470" cy="118" r="7" fill="#6b40d8"/><text x="482" y="122" fill="#6b40d8" font-size="13" font-weight="600">"cat"</text><circle cx="540" cy="70" r="5" fill="#8a8f9a"/><text x="550" y="74" fill="#8a8f9a" font-size="12">"dog"</text><circle cx="560" cy="160" r="5" fill="#8a8f9a"/><text x="570" y="164" fill="#8a8f9a" font-size="12">"teapot"</text><text x="340" y="60" fill="#5c6270" font-size="12">E: many → one</text><text x="20" y="224" fill="#5c6270" font-size="11.5">E throws away which cat, which pose, which light. Its "inverse" is a distribution p(x | "cat") over