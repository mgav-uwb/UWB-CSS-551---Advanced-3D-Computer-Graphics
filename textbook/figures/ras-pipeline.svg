<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="640" height="180" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1c22"/></marker></defs><rect x="20" y="40" width="96" height="60" rx="6" fill="#1f5fb0" fill-opacity="0.12" stroke="#1f5fb0" stroke-width="1.4"/><text x="68" y="68" text-anchor="middle" font-weight="600" font-size="12" fill="#1f5fb0">vertex shader</text><text x="68" y="83" text-anchor="middle" font-size="10.5" fill="#5c6270">M, V, P per vertex</text><line x1="116" y1="70" x2="124" y2="70" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><text x="68" y="118" text-anchor="middle" font-size="10.5" fill="#1f5fb0">programmable</text><rect x="124" y="40" width="96" height="60" rx="6" fill="#8a8f9a" fill-opacity="0.12" stroke="#8a8f9a" stroke-width="1.4"/><text x="172" y="68" text-anchor="middle" font-weight="600" font-size="12" fill="#8a8f9a">clip + divide + viewport</text><text x="172" y="83" text-anchor="middle" font-size="10.5" fill="#5c6270">fixed</text><line x1="220" y1="70" x2="228" y2="70" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><rect x="228" y="40" width="96" height="60" rx="6" fill="#8a8f9a" fill-opacity="0.12" stroke="#8a8f9a" stroke-width="1.4"/><text x="276" y="68" text-anchor="middle" font-weight="600" font-size="12" fill="#8a8f9a">rasterize</text><text x="276" y="83" text-anchor="middle" font-size="10.5" fill="#5c6270">edge functions, barycentrics</text><line x1="324" y1="70" x2="332" y2="70" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><rect x="332" y="40" width="96" height="60" rx="6" fill="#1f5fb0" fill-opacity="0.12" stroke="#1f5fb0" stroke-width="1.4"/><text x="380" y="68" text-anchor="middle" font-weight="600" font-size="12" fill="#1f5fb0">fragment shader</text><text x="380" y="83" text-anchor="middle" font-size="10.5" fill="#5c6270">texture, lighting per pixel</text><line x1="428" y1="70" x2="436" y2="70" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><text x="380" y="118" text-anchor="middle" font-size="10.5" fill="#1f5fb0">programmable</text><rect x="436" y="40" width="96" height="60" rx="6" fill="#8a8f9a" fill-opacity="0.12" stroke="#8a8f9a" stroke-width="1.4"/><text x="484" y="68" text-anchor="middle" font-weight="600" font-size="12" fill="#8a8f9a">depth test + blend</text><text x="484" y="83" text-anchor="middle" font-size="10.5" fill="#5c6270">z-buffer, write</text><line x1="532" y1="70" x2="540" y2="70" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><rect x="540" y="40" width="96" height="60" rx="6" fill="#0a7d5a" fill-opacity="0.12" stroke="#0a7d5a" stroke-width="1.4"/><text x="588" y="68" text-anchor="middle" font-weight="600" font-size="12" fill="#0a7d5a">framebuffer</text><text x="588" y="83" text-anchor="middle" font-size="10.5" fill="#5c6270">scan-out</text><text x="20" y="160" font-size="11.5" fill="#5c6270">Blue stages run your code (a shader); gray stages are fixed silicon whose behaviour you configure. Every triangle of every frame passes left to right.</text>
</svg>
