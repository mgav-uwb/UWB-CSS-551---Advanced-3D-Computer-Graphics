t x="520" y="240" font-size="15">I = 10, r = 2, θ = 60°:  E = 10 × 0.5 / 4 = 1.25 W/m²</text><text x="520" y="264" font-size="15" fill="#5c6270">a 1 cm² patch: dω = 0.0000125 sr</text>
