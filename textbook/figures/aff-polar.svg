<rect x="30" y="30" width="185" height="185" fill="none" stroke="#d7dbe3"/><text x="62.17" y="230" text-anchor="middle" fill="#5c6270" font-size="11">0</text><text x="142.61" y="230" text-anchor="middle" fill="#5c6270" font-size="11">1</text><text x="24" y="186.83" text-anchor="end" fill="#5c6270" font-size="11">0</text><text x="24" y="106.39" text-anchor="end" fill="#5c6270" font-size="11">1</text><text x="30" y="22" font-weight="600" font-size="13">the square</text><polygon points="62.17,182.83 142.61,182.83 142.61,102.39 62.17,102.39" fill="#1f5fb0" fill-opacity="0.15" stroke="#1f5fb0" stroke-width="1.5"/><rect x="235" y="30" width="185" height="185" fill="none" stroke="#d7dbe3"/><text x="267.17" y="230" text-anchor="middle" fill="#5c6270" font-size="11">0</text><text x="347.61" y="230" text-anchor="middle" fill="#5c6270" font-size="11">1</text><text x="229" y="186.83" text-anchor="end" fill="#5c6270" font-size="11">0</text><text x="229" y="106.39" text-anchor="end" fill="#5c6270" font-size="11">1</text><text x="235" y="22" font-weight="600" font-size="13">after the stretch P</text><polygon points="267.17,182.83 345.21,163.32 364.72,75.53 286.68,95.04" fill="#d98c1f" fill-opacity="0.15" stroke="#d98c1f" stroke-width="1.5"/><polyline fill="none" stroke="#8a8f9a"  stroke-linejoin="round" stroke-dasharray="3 3" stroke-width="1" points="247.37,208.19 356.27,68.71"/><polyline fill="none" stroke="#8a8f9a"  stroke-linejoin="round" stroke-dasharray="3 3" stroke-width="1" points="241.81,163.03 343.25,242.23"/><rect x="440" y="30" width="185" height="185" fill="none" stroke="#d7dbe3"/><text x="472.17" y="230" text-anchor="middle" fill="#5c6270" font-size="11">0</text><text x="552.61" y="230" text-anchor="middle" fill="#5c6270" font-size="11">1</text><text x="434" y="186.83" text-anchor="end" fill="#5c6270" font-size="11">0</text><text x="434" y="106.39" text-anchor="end" fill="#5c6270" font-size="11">1</text><text x="440" y="22" font-weight="600" font-size="13">after R P = the shear A</text><polygon points="472.17,182.83 552.61,182.83 592.83,102.39 512.39,102.39" fill="#c0392b" fill-opacity="0.15" stroke="#c0392b" stroke-width="1.5"/><text x="30" y="245" font-size="11.5" fill="#5c6270">A = [[1, 0.5], [0, 1]] = R P: P stretches by 1.281 along (0.615, 0.788) and by 0.781 across it;</text><text x="30" y="262" font-size="11.5" fill="#5c6270">R then rotates by -14.04°. TRS can store a stretch only along the axes, so it cannot store this map.</text>
