"3"/><polygon points="90,192.72 96.53,197.03 90.47,200.53" fill="#0a7d5a"/><text x="205.28" y="238" font-size="12" fill="#c0392b" font-weight="600">column 0</text><text x="84" y="186.72" font-size="12" fill="#0a7d5a" font-weight="600" text-anchor="end">column 1</text><text x="266.56" y="204" font-size="12" fill="#c0392b" text-anchor="middle">2 · column 0</text><circle cx="228.56" cy="112.72" r="5" fill="#128a8a"/><text x="220.56" y="104.72" font-size="12" fill="#128a8a" font-weight="600" text-anchor="end">R p</text><text x="370" y="40" font-weight="600" font-size="13">R(30°): where the two axes land</text><text x="370" y="66" font-size="12" fill="#c0392b">column 0 = where the x axis lands = (0.866, 0.5)</text><text x="370" y="86" font-size="12" fill="#0a7d5a">column 1 = where the y axis lands = (−0.5, 0.866)</text><text x="370" y="118" font-size="12" font-weight="600">R p = 2 · column 0 + 1 · column 1</text><text x="370" y="138" font-size="12" >   = (1.732, 1) + (−0.5, 0.866)</text><text x="370" y="158" font-size="12" fill="#128a8a" font-weight="600">   = (1.232, 1.866)</text><text x="370" y="192" font-size="12" fill="#5c6270">The gray unit square lands on the teal one:</text><text x="370" y="210" font-size="12" fill="#5c6270">still a unit square, area 1 (det R = 1).</text><text x="370" y="240" font-size="12" fill="#5c6270">Each point keeps its recipe, so much x and</text><text x="370" y="258" font-size="12" fill="#5c6270">so much y, read with the landed axes.</text>
</svg>
