29.11 524.37,128.5 523.22,127.91 522.06,127.36 520.88,126.83 519.69,126.33 518.49,125.86 517.28,125.43"/><line x1="517.28" y1="125.43" x2="519.32" y2="126.05" stroke="#6b40d8" stroke-width="1.5"/><polygon points="513.59,124.29 520.21,123.19 518.44,128.92" fill="#6b40d8"/><text x="380" y="26" font-weight="600" font-size="13">two turns: multiply, and the angles add</text><text x="380" y="302" font-size="12" fill="#5c6270">z₁ z₂ = z₂ z₁: in 2D the order never matters.</text><text x="20" y="340" font-size="12" fill="#5c6270">In 3D the order does matter, so the 3D version (the quaternion) needs a product with ij ≠ ji.</text>
