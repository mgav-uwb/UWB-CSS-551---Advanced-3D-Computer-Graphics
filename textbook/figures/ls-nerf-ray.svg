<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="640" height="240" fill="#ffffff"/>
<defs><marker id="ah4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1c22"/></marker></defs><polygon points="20,130 60,110 60,150" fill="#1a1c22"/><text x="14" y="172" font-size="11.5">camera o</text><line x1="60" y1="130" x2="380" y2="80" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah4)"/><text x="90" y="160" font-size="12" font-style="italic">ray r(s) = o + s·d, sampled at s₁ … s₇</text><ellipse cx="270" cy="95" rx="55" ry="32" fill="#d98c1f" fill-opacity="0.25" stroke="#d98c1f"/><text x="255" y="60" fill="#d98c1f" font-size="11">where σ is large</text><circle cx="110" cy="122.19" r="3.5" fill="#8a8f9a"/><text x="110" y="142.19" text-anchor="middle" font-size="10.5" fill="#5c6270">s₁</text><circle cx="150" cy="115.94" r="3.5" fill="#8a8f9a"/><text x="150" y="135.94" text-anchor="middle" font-size="10.5" fill="#5c6270">s₂</text><circle cx="190" cy="109.69" r="3.5" fill="#8a8f9a"/><text x="190" y="129.69" text-anchor="middle" font-size="10.5" fill="#5c6270">s₃</text><circle cx="230" cy="103.44" r="5" fill="#c0392b"/><text x="230" y="123.44" text-anchor="middle" font-size="10.5" fill="#5c6270">s₄</text><circle cx="270" cy="97.19" r="5" fill="#c0392b"/><text x="270" y="117.19" text-anchor="middle" font-size="10.5" fill="#5c6270">s₅</text><circle cx="310" cy="90.94" r="5" fill="#c0392b"/><text x="310" y="110.94" text-anchor="middle" font-size="10.5" fill="#5c6270">s₆</text><circle cx="350" cy="84.69" r="3.5" fill="#8a8f9a"/><text x="350" y="104.69" text-anchor="middle" font-size="10.5" fill="#5c6270">s₇</text><rect x="420" y="40" width="200" height="70" rx="8" fill="#1f5fb0" fill-opacity="0.12" stroke="#1f5fb0"/><text x="520" y="62" text-anchor="middle" font-weight="600" fill="#1f5fb0" font-size="13">F_θ : (p, d) ↦ (c, σ)</text><text x="520" y="82" text-anchor="middle" fill="#5c6270" font-size="10.5">a small MLP, run once per sample</text><text x="520" y="98" text-anchor="middle" fill="#5c6270" font-size="10.5">in: encoded position + direction</text><line x1="270" y1="97" x2="420" y2="75" stroke="#1f5fb0" stroke-dasharray="3 3"/><rect x="420" y="135" width="200" height="90" rx="8" fill="#0a7d5a" fill-opacity="0.10" stroke="#0a7d5a"/><text x="520" y="155" text-anchor="middle" font-weight="600" fill="#0a7d5a" font-size="12">composite front to back</text><text x="430" y="175" font-size="11.5">αᵢ = 1 − exp(−σᵢ δᵢ)</text><text x="430" y="192" font-size="11.5">Tᵢ = Π(1 − αⱼ) over j &lt; i</text><text x="430" y="209" font-size="11.5">C = Σ Tᵢ αᵢ cᵢ</text><text x="20" y="200" fill="#5c6270" font-size="11.5">Nothing here is a mesh: the scene is the function F_θ.</text>
</svg>
