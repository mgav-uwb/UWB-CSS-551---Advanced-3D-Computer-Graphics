49, 0.814, 0.465)</text><text x="335" y="166" font-size="12" fill="#128a8a">h is 30.7° from a and 30.7° from b</text><text x="335" y="200" font-size="12" font-weight="600">q = normalize(a × b, 1 + a · b)</text><text x="335" y="218" font-size="12" >  = (0.372, −0.279, 0.209, 0.860)  [x, y, z, w]</text><text x="335" y="240" font-size="12" fill="#5c6270">check: w = cos(θ/2) = 0.860</text><text x="20" y="440" font-size="12" font-weight="600">q = normalize(a × b, 1 + a · b): the half angle without trigonometry.</text><text x="20" y="458" fill="#5c6270" font-size="12">Adding a and b gives the halfway direction h; the vector part of q is a × b, which is sin θ times the unit axis.</text>
