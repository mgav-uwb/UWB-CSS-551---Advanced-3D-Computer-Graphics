, 1)</text><polygon points="315.91,71.82 314.91,65.5 312,59.8 307.48,55.27 301.78,52.36 295.45,51.36 289.13,52.36 283.43,55.27 278.91,59.8 276,65.5 275,71.82 276,78.14 278.91,83.84 283.43,88.37 289.13,91.27 295.45,92.27 301.78,91.27 307.48,88.37 312,83.84 314.91,78.14 315.91,71.82" fill="#1f5fb0" fill-opacity="0.2" stroke="#1f5fb0" stroke-width="1.5"/><text x="257.95" y="41.14" font-size="10.5" fill="#1f5fb0">T(1.4, 0, 1)</text><polygon points="125,208.18 124,201.86 121.09,196.16 116.57,191.63 110.87,188.73 104.55,187.73 98.22,188.73 92.52,191.63 88,196.16 85.09,201.86 84.09,208.18 85.09,214.5 88,220.2 92.52,224.73 98.22,227.64 104.55,228.64 110.87,227.64 116.57,224.73 121.09,220.2 124,214.5 125,208.18" fill="#1f5fb0" fill-opacity="0.2" stroke="#1f5fb0" stroke-width="1.5"/><text x="67.05" y="245.68" font-size="10.5" fill="#1f5fb0">T(-1.4, 0, -1)</text><polygon points="315.91,208.18 314.91,201.86 312,196.16 307.48,191.63 301.78,188.73 295.45,187.73 289.13,188.73 283.43,191.63 278.91,196.16 276,201.86 275,208.18 276,214.5 278.91,220.2 283.43,224.73 289.13,227.64 295.45,228.64 301.78,227.64 307.48,224.73 312,220.2 314.91,214.5 315.91,208.18" fill="#1f5fb0" fill-opacity="0.2" stroke="#1f5fb0" stroke-width="1.5"/><text x="257.95" y="245.68" font-size="10.5" fill="#1f5fb0">T(1.4, 0, -1)</text><text x="380" y="70" font-size="12.5">Four nodes share one mesh;</text><text x="380" y="88" font-size="12.5">they differ only by their local</text><text x="380" y="106" font-size="12.5">matrices. Move the body node and</text><text x="380" y="124" font-size="12.5">all four ride along.</text><text x="380" y="154" font-size="12" fill="#5c6270">A mirrored arm is the same mesh</text><text x="380" y="170" font-size="12" fill="#5c6270">under S(−1, 1, 1): det &lt; 0, so its</text><text x="380" y="186" font-size="12" fill="#5c6270">windings flip (the affine chapter).</text>
