<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="640" height="300" fill="#ffffff"/>
<rect x="188" y="124" width="64" height="64" fill="#c0392b" fill-opacity="0.2" stroke="#1a1c22"/><text x="220" y="160" text-anchor="middle" font-size="12" font-weight="600">+X</text><rect x="60" y="124" width="64" height="64" fill="#e59a8f" fill-opacity="0.2" stroke="#1a1c22"/><text x="92" y="160" text-anchor="middle" font-size="12" font-weight="600">-X</text><rect x="124" y="60" width="64" height="64" fill="#0a7d5a" fill-opacity="0.2" stroke="#1a1c22"/><text x="156" y="96" text-anchor="middle" font-size="12" font-weight="600">+Y</text><rect x="124" y="188" width="64" height="64" fill="#8fd1b8" fill-opacity="0.5" stroke="#1a1c22"/><text x="156" y="224" text-anchor="middle" font-size="12" font-weight="600">-Y</text><rect x="124" y="124" width="64" height="64" fill="#1f5fb0" fill-opacity="0.2" stroke="#1a1c22"/><text x="156" y="160" text-anchor="middle" font-size="12" font-weight="600">+Z</text><rect x="252" y="124" width="64" height="64" fill="#9db8e0" fill-opacity="0.2" stroke="#1a1c22"/><text x="284" y="160" text-anchor="middle" font-size="12" font-weight="600">-Z</text><circle cx="168" cy="240" r="4" fill="#1a1c22"/><text x="176" y="244" font-size="10.5">(s, t) = (0.688, 0.188)</text><text x="340" y="80" font-size="12">d = (0.303, -0.808, 0.505)</text><text x="340" y="100" font-size="11">largest |component|: |y| = 0.808, y &lt; 0</text><text x="340" y="118" font-size="11">so the −Y face</text><text x="340" y="140" font-size="11">s = (x/|y| + 1)/2 = 0.688</text><text x="340" y="158" font-size="11">t = (−z/|y| + 1)/2 = 0.188</text><text x="340" y="180" font-size="11">256² face: texel (176, 48)</text><text x="20" y="24" font-size="12.5" font-weight="600">a cube map: six faces, one lookup by the dominant axis</text><text x="20" y="285" font-size="11" fill="#5c6270">the cross is only the storage layout: pick the face, divide by the major component, read a 2D texture</text>
</svg>
