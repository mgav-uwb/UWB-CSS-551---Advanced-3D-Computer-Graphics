<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="640" height="320" fill="#ffffff"/>
<rect x="50" y="30" width="260" height="260" fill="none" stroke="#d7dbe3"/><text x="66.96" y="305" text-anchor="middle" fill="#5c6270" font-size="11">-2</text><text x="180" y="305" text-anchor="middle" fill="#5c6270" font-size="11">0</text><text x="293.04" y="305" text-anchor="middle" fill="#5c6270" font-size="11">2</text><text x="44" y="277.04" text-anchor="end" fill="#5c6270" font-size="11">-2</text><text x="44" y="164" text-anchor="end" fill="#5c6270" font-size="11">0</text><text x="44" y="50.96" text-anchor="end" fill="#5c6270" font-size="11">2</text><text x="50" y="22" font-weight="600" font-size="13">Reflect in x, then in y: a 180° rotation</text><polygon points="208.26,131.74 293.04,131.74 293.04,92.17 236.52,92.17 236.52,58.26 208.26,58.26" fill="#1f5fb0" fill-opacity="0.15" stroke="#1f5fb0" stroke-width="1.5"/><text x="208.26" y="44.13" font-size="11" fill="#1f5fb0" font-weight="600">F (right-handed)</text><polygon points="151.74,131.74 66.96,131.74 66.96,92.17 123.48,92.17 123.48,58.26 151.74,58.26" fill="#c0392b" fill-opacity="0.15" stroke="#c0392b" stroke-width="1.5"/><text x="55.65" y="44.13" font-size="11" fill="#c0392b" font-weight="600">M_x F (mirror)</text><polygon points="151.74,188.26 66.96,188.26 66.96,227.83 123.48,227.83 123.48,261.74 151.74,261.74" fill="#0a7d5a" fill-opacity="0.15" stroke="#0a7d5a" stroke-width="1.5"/><text x="55.65" y="281.52" font-size="11" fill="#0a7d5a" font-weight="600">M_y M_x F = R(180°)</text><polyline fill="none" stroke="#8a8f9a"  stroke-linejoin="round" stroke-dasharray="4 3" stroke-width="1" points="180,290 180,30"/><polyline fill="none" stroke="#8a8f9a"  stroke-linejoin="round" stroke-dasharray="4 3" stroke-width="1" points="50,160 310,160"/><text x="340" y="70" font-size="12.5">M_x = diag(−1, 1): det −1, a mirror</text><text x="340" y="90" font-size="12.5">M_y = diag(1, −1): det −1, a mirror</text><text x="340" y="118" font-size="12.5" font-weight="600">M_y M_x = diag(−1, −1) = R(180°): det +1</text><text x="340" y="146" font-size="11.5" fill="#5c6270">one mirror flips the letter (the notch</text><text x="340" y="162" font-size="11.5" fill="#5c6270">changes side); two mirrors turn it</text><text x="340" y="178" font-size="11.5" fill="#5c6270">without flipping. Every rotation is</text><text x="340" y="194" font-size="11.5" fill="#5c6270">two reflections; a mirror is never</text><text x="340" y="210" font-size="11.5" fill="#5c6270">a rotation, whatever the angle.</text>
</svg>
