<rect x="50" y="30" width="360" height="280" fill="none" stroke="#d7dbe3"/><text x="101.43" y="325" text-anchor="middle" fill="#5c6270" font-size="11">-3</text><text x="187.14" y="325" text-anchor="middle" fill="#5c6270" font-size="11">-2</text><text x="272.86" y="325" text-anchor="middle" fill="#5c6270" font-size="11">-1</text><text x="358.57" y="325" text-anchor="middle" fill="#5c6270" font-size="11">0</text><text x="44" y="258" text-anchor="end" fill="#5c6270" font-size="11">-1</text><text x="44" y="164.67" text-anchor="end" fill="#5c6270" font-size="11">0</text><text x="44" y="71.33" text-anchor="end" fill="#5c6270" font-size="11">1</text><text x="230" y="342" text-anchor="middle" fill="#5c6270">z (view space)</text><text transform="translate(10,170) rotate(-90)" text-anchor="middle" fill="#5c6270">y</text><text x="50" y="22" font-weight="600" font-size="13">A triangle crossing the near plane, side view</text><line x1="272.86" y1="30" x2="272.86" y2="310" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 3"/><text x="277.14" y="44" font-size="11" fill="#c0392b">near plane z = −1</text><circle cx="358.57" cy="160.67" r="5" fill="#1a1c22" /><text x="362.86" y="149.47" font-size="11">eye</text><polygon points="101.43,123.33 152.86,104.67 324.29,207.33" fill="#8a8f9a" fill-opacity="0.15" stroke="#8a8f9a" stroke-width="1.5" stroke-dasharray="4 3"/><polygon points="101.43,123.33 152.86,104.67 272.86,176.53 272.86,187.92" fill="#1f5fb0" fill-opacity="0.25" stroke="#1f5fb0" stroke-width="2"/><circle cx="101.43" cy="123.33" r="4" fill="#1a1c22" /><text x="106.57" y="114" font-size="10.5">v0 (-0.8, 0.4, -3)</text><circle cx="152.86" cy="104.67" r="4" fill="#1a1c22" /><text x="158" y="95.33" font-size="10.5">v1 (1, 0.6, -2.4)</text><circle cx="324.29" cy="207.33" r="4" fill="#c0392b" /><text x="329.43" y="198" font-size="10.5">v2 (0.3, -0.5, -0.4)</text><circle cx="272.86" cy="176.53" r="4.5" fill="#1f5fb0" /><text x="266" y="161.6" font-size="10.5" fill="#1f5fb0" text-anchor="end">t = 0.7</text><circle cx="272.86" cy="187.92" r="4.5" fill="#1f5fb0" /><text x="266" y="204.72" font-size="10.5" fill="#1f5fb0" text-anchor="end">t = 0.2308</text><text x="430" y="70" font-size="11.5">gray: the triangle as sent;</text><text x="430" y="88" font-size="11.5">v2 is in front of the near plane.</text><text x="430" y="118" font-size="11.5">blue: the clipped polygon, four</text><text x="430" y="136" font-size="11.5">vertices, two on the near plane;</text><text x="430" y="154" font-size="11.5">it is fanned into two triangles.</text><text x="430" y="184" font-size="11" fill="#5c6270">Without clipping, v2’s divide by</text><text x="430" y="200" font-size="11" fill="#5c6270">w = 0.4 puts it at NDC z = -4.429,</text><text x="430" y="216" font-size="11" fill="#5c6270">and a vertex behind the eye would</text><text x="430" y="232" font-size="11" fill="#5c6270">flip sign entirely.</text>
