<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="640" height="372" fill="#ffffff"/>
<text x="20" y="24" font-weight="600" font-size="13">Translation in 2D is a shear of 3D: the plane w = 1 slides, the floor w = 0 stays</text><polygon points="139.66,325.25 398.64,249.87 265.35,173.73 6.37,249.12" fill="#8a8f9a" fill-opacity="0.08" stroke="#8a8f9a" stroke-width="1"/><line x1="150" y1="300" x2="379.12" y2="233.3" stroke="#8a8f9a" stroke-width="1"/><polygon points="384.89,231.62 379.96,236.18 378.29,230.42" fill="#8a8f9a"/><text x="388.89" y="235.62" fill="#8a8f9a" font-weight="600" font-size="12" text-anchor="start">x</text><line x1="150" y1="300" x2="39.12" y2="236.67" stroke="#8a8f9a" stroke-width="1"/><polygon points="33.91,233.69 40.61,234.06 37.63,239.27" fill="#8a8f9a"/><text x="19.91" y="231.69" fill="#8a8f9a" font-weight="600" font-size="12" text-anchor="start">y</text><line x1="150" y1="300" x2="201.25" y2="275.48" stroke="#c0392b" stroke-width="2.5"/><polygon points="209.37,271.59 203.2,279.54 199.31,271.42" fill="#c0392b"/><text x="205.37" y="289.59" fill="#c0392b" font-weight="600" font-size="11.5">a direction (w = 0): not moved</text><line x1="150" y1="300" x2="150" y2="187.75" stroke="#8a8f9a" stroke-width="1.2"/><polygon points="150,181.75 153,187.75 147,187.75" fill="#8a8f9a"/><text x="134" y="179.75" fill="#8a8f9a" font-weight="600" font-size="12" text-anchor="start">w</text><line x1="150" y1="300" x2="270.06" y2="102.85" stroke="#1f5fb0" stroke-width="1.4" stroke-dasharray="5 4"/><text x="276.06" y="98.85" fill="#1f5fb0" font-size="11.5">the w axis, after: it leans by t</text><polygon points="139.66,257.69 398.64,182.3 265.35,106.17 6.37,181.56" fill="#1f5fb0" fill-opacity="0.1" stroke="#1f5fb0" stroke-width="1"/><polygon points="150,232.43 163.25,228.57 136.59,213.35 174.54,202.3 158.2,192.97 107,207.87" fill="#8a8f9a" fill-opacity="0.25" stroke="#8a8f9a" stroke-width="1.6"/><polygon points="227.46,172.81 240.71,168.95 214.05,153.73 251.99,142.68 235.65,133.35 184.46,148.25" fill="#1f5fb0" fill-opacity="0.3" stroke="#1f5fb0" stroke-width="1.6"/><line x1="135.13" y1="218.22" x2="206.24" y2="163.48" stroke="#1a1c22" stroke-width="1.6"/><polygon points="212.58,158.6 208.68,166.65 203.8,160.31" fill="#1a1c22"/><text x="216.24" y="208.94" font-weight="600" font-size="12">t = (2, 1)</text><text x="259.35" y="100.17" font-size="12" fill="#1f5fb0" font-weight="600" text-anchor="end">w = 1</text><circle cx="150" cy="300" r="3.5" fill="#1a1c22"/><text x="452" y="72" font-family="Menlo, monospace" font-size="12.5" style="white-space: pre">T = [ 1  0  2 ]</text><text x="452" y="90" font-family="Menlo, monospace" font-size="12.5" style="white-space: pre">    [ 0  1  1 ]</text><text x="452" y="108" font-family="Menlo, monospace" font-size="12.5" style="white-space: pre">    [ 0  0  1 ]</text><text x="452" y="140" font-size="12" fill="#1f5fb0" font-weight="600">T (x, y, 1) = (x + 2, y + 1, 1)</text><text x="452" y="156" font-size="12" fill="#5c6270">a point moves by t</text><text x="452" y="184" font-size="12" fill="#c0392b" font-weight="600">T (x, y, 0) = (x, y, 0)</text><text x="452" y="200" font-size="12" fill="#5c6270">a direction does not</text><text x="452" y="232" font-size="12" fill="#1a1c22">In 3D, T is linear: it fixes</text><text x="452" y="248" font-size="12" fill="#1a1c22">the origin and moves each</text><text x="452" y="264" font-size="12" fill="#1a1c22">height w by w · t, a shear.</text><text x="452" y="280" font-size="12" fill="#1a1c22">On the plane w = 1 that shear</text><text x="452" y="296" font-size="12" fill="#1a1c22">is the translation by t.</text><text x="20" y="360" font-size="12" fill="#5c6270">The same lift one dimension higher puts 3D translation into a 4×4: (x, y, z) becomes (x, y, z, 1).</text>
</svg>
