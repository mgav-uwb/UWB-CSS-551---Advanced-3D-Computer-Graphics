<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 345" width="1000" height="345" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="1000" height="345" fill="#ffffff"/>
<line x1="82" y1="277.83" x2="385.05" y2="277.83" stroke="#c0392b" stroke-width="2.6"/><polygon points="395.05,277.83 385.05,283.83 385.05,271.83" fill="#c0392b"/><line x1="82" y1="277.83" x2="324.9" y2="66.14" stroke="#1f5fb0" stroke-width="2.6"/><polygon points="332.44,59.57 328.84,70.66 320.96,61.61" fill="#1f5fb0"/><line stroke-dasharray="7 4" x1="332.44" y1="59.57" x2="392.29" y2="268.21" stroke="#6b40d8" stroke-width="2.6"/><polygon points="395.05,277.83 386.52,269.87 398.06,266.56" fill="#6b40d8"/><text x="238.52" y="303.91" fill="#c0392b" font-size="15" font-weight="600" text-anchor="middle">a, |a|² = 5</text><text x="186.22" y="155.65" fill="#1f5fb0" font-size="15" font-weight="600" text-anchor="end">b, |b|² = 6</text><text x="349.74" y="162.17" fill="#6b40d8" font-size="15" font-weight="600" text-anchor="end">a − b, |a − b|² = 3</text><polyline fill="none" stroke="#1a1c22"  stroke-linejoin="round" stroke-width="2" points="140.8,277.83 140.79,276.8 140.76,275.77 140.71,274.74 140.63,273.71 140.54,272.68 140.43,271.66 140.29,270.64 140.14,269.62 139.96,268.6 139.76,267.59 139.55,266.58 139.31,265.57 139.05,264.57 138.77,263.57 138.48,262.58 138.16,261.59 137.82,260.61 137.46,259.64 137.09,258.67 136.69,257.71 136.28,256.75 135.84,255.81 135.39,254.87 134.91,253.94 134.42,253.01 133.91,252.1 133.39,251.2 132.84,250.3 132.27,249.42 131.69,248.54 131.09,247.67 130.48,246.82 129.84,245.98 129.19,245.14 128.52,244.32 127.84,243.51 127.14,242.72 126.42,241.93 125.69,241.16 124.94,240.4"/><text x="144.5" y="260.05" font-size="14">θ = 43.1°</text><circle cx="481" cy="29" r="11" fill="#1a1c22"/><text x="481" y="34" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">1</text><text x="500" y="34" font-size="15" font-weight="600" fill="#1a1c22">the triangle has sides a, b and a − b</text><text x="500" y="56" font-size="14">a − b runs from the tip of b to the tip of a</text><circle cx="481" cy="93" r="11" fill="#1a1c22"/><text x="481" y="98" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">2</text><text x="500" y="98" font-size="15" font-weight="600" fill="#1a1c22">geometry: the law of cosines</text><text x="500" y="120" font-size="14">|a − b|² = |a|² + |b|² − 2 |a| |b| cos θ</text><circle cx="481" cy="157" r="11" fill="#1a1c22"/><text x="481" y="162" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">3</text><text x="500" y="162" font-size="15" font-weight="600" fill="#1a1c22">algebra: square a − b component by component</text><text x="500" y="184" font-size="14">(ax − bx)² = ax² − 2 ax bx + bx²,  same for y and z;</text><text x="500" y="206" font-size="14">add the three:  |a − b|² = |a|² + |b|² − 2 (ax bx + ay by + az bz)</text><text x="500" y="228" font-size="14" xml:space="preserve">                                   = |a|² + |b|² − 2 a · b</text><circle cx="481" cy="265" r="11" fill="#0a7d5a"/><text x="481" y="270" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">4</text><text x="500" y="270" font-size="15" font-weight="600" fill="#0a7d5a">same left side, so the last terms match</text><text x="500" y="292" font-size="14">a · b = |a| |b| cos θ</text><text x="500" y="324" font-size="14" fill="#5c6270">check, a = (2, 1, 0), b = (1, 2, 1):  3 = 5 + 6 − 2 · 4</text>
</svg>
