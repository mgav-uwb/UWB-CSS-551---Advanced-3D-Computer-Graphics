267" y="277" text-anchor="middle" font-size="12.5" font-family="Menlo, monospace">1</text><rect x="50" y="50" width="248" height="248" fill="none" stroke="#1a1c22" stroke-width="1.5"/><text x="50" y="36" font-size="12.5" font-weight="600">makeTRS(1,2,3, 0,60,0, 2,1,0.5): the matrix, with each entry’s array index</text><text x="322" y="80" font-size="12">column-major (three.js, OpenGL, this library):</text><text x="322" y="98" font-size="12">index = 4·col + row; a column is 4 consecutive</text><text x="322" y="116" font-size="12">entries; the translation is [12], [13], [14].</text><text x="322" y="150" font-size="12">row-major with row vectors (DirectX, HLSL):</text><text x="322" y="168" font-size="12">the same 16 numbers in the same array order</text><text x="322" y="186" font-size="12">read as the TRANSPOSE; a point is a row and</text><text x="322" y="204" font-size="12">multiplies from the left: p′ = p Mᵀ.</text><text x="322" y="238" font-size="12" fill="#5c6270">The bytes agree; the notation is transposed.</text><text x="322" y="256" font-size="12" fill="#5c6270">A bug appears only when one convention’s</text><text x="322" y="274" font-size="12" fill="#5c6270">product order is used with the other’s vectors.</text>
