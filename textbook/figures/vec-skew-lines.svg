<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="640" height="400" fill="#ffffff"/>
<text x="20" y="24" fill="#1a1c22"  font-weight="600" font-size="14">Two skew lines: one cross, one dot</text><text x="20" y="44" fill="#5c6270" font-size="12.5" >p1 = (0, 0, 0), d1 = (1, 0, 0);   p2 = (0, 1, 2), d2 = (0, 1, 1)</text><line x1="164.2" y1="253.03" x2="369" y2="162.25" stroke="#1f5fb0"  stroke-width="2.2"/><polygon points="375.4,159.41 370.27,165.13 367.72,159.37" fill="#1f5fb0"/><text x="331.4" y="149.41" fill="#1f5fb0" font-size="12.5" font-weight="600">line 1</text><line x1="234.97" y1="320.39" x2="477.65" y2="105.89" stroke="#0a7d5a"  stroke-width="2.2"/><polygon points="482.9,101.25 479.74,108.25 475.57,103.53" fill="#0a7d5a"/><text x="490.9" y="99.25" fill="#0a7d5a" font-size="12.5" font-weight="600">line 2</text><line x1="250" y1="215" x2="250" y2="215" stroke="#8a8f9a"  stroke-width="2"/><polygon points="250,215 250,215 250,215" fill="#8a8f9a"/><line x1="250" y1="215" x2="287.56" y2="273.9" stroke="#c0392b"  stroke-width="3.5"/><circle cx="250" cy="215" r="4.5" fill="#c0392b"/><circle cx="287.56" cy="273.9" r="4.5" fill="#c0392b"/><polyline fill="none" stroke="#1a1c22" stroke-width="1.2" points="260.97,210.14 267.42,220.25 256.45,225.12"/><polyline fill="none" stroke="#1a1c22" stroke-width="1.2" points="296.56,265.96 290.1,255.84 281.11,263.79"/><text x="240" y="191" fill="#c0392b" font-size="12.5" text-anchor="end">closest point on line 1</text><text x="240" y="207" fill="#c0392b" font-size="12.5" text-anchor="end" font-weight="600">Q1 = (0, 0, 0)</text><text x="303.56" y="297.9" fill="#c0392b" font-size="12.5" >closest point on line 2</text><text x="303.56" y="313.9" fill="#c0392b" font-size="12.5" font-weight="600">Q2 = (0, −0.5, 0.5)</text><text x="256.78" y="272.45" fill="#c0392b" font-size="12.5" text-anchor="end">shortest segment,</text><text x="256.78" y="288.45" fill="#c0392b" font-size="12.5" text-anchor="end">along d1 × d2 = (0, −1, 1)</text><text x="20" y="360" fill="#1a1c22" font-size="12.5" >|d1 × d2| = 1.414 = √2;   (p2 − p1) · (d1 × d2) = 1</text><text x="20" y="382" fill="#c0392b" font-size="12.5" font-weight="600">distance = |1| / √2 = 0.707 = |Q2 − Q1|</text>
</svg>
