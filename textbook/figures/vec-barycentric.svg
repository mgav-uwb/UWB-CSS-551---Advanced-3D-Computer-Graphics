<rect x="50" y="30" width="300" height="300" fill="none" stroke="#d7dbe3"/><text x="90" y="345" text-anchor="middle" fill="#5c6270" font-size="11">0</text><text x="190" y="345" text-anchor="middle" fill="#5c6270" font-size="11">1</text><text x="290" y="345" text-anchor="middle" fill="#5c6270" font-size="11">2</text><text x="44" y="274" text-anchor="end" fill="#5c6270" font-size="11">-2</text><text x="44" y="174" text-anchor="end" fill="#5c6270" font-size="11">-1</text><text x="44" y="74" text-anchor="end" fill="#5c6270" font-size="11">0</text><text x="200" y="362" text-anchor="middle" fill="#5c6270">x</text><text transform="translate(10,180) rotate(-90)" text-anchor="middle" fill="#5c6270">z</text><text x="50" y="22" font-weight="600" font-size="13">Barycentric coordinates from three cross products</text><polygon points="90,70 290,70 90,270" fill="#1f5fb0" fill-opacity="0.08" stroke="#1a1c22" stroke-width="1.5"/><polygon points="140,120 290,70 90,270" fill="#c0392b" fill-opacity="0.18" stroke="none"/><polygon points="140,120 90,270 90,70" fill="#0a7d5a" fill-opacity="0.18" stroke="none"/><polygon points="140,120 90,70 290,70" fill="#1f5fb0" fill-opacity="0.18" stroke="none"/><circle cx="140" cy="120" r="4.5" fill="#1a1c22" /><text x="148" y="105" font-size="11.5">X = (0.5, 0, −0.5)</text><circle cx="290" cy="270" r="4" fill="#8a8f9a" /><text x="200" y="290" font-size="11" fill="#8a8f9a">outside: (2, 0, −2)</text><text x="60" y="45" font-size="12">P0</text><text x="295" y="45" font-size="12">P1</text><text x="60" y="280" font-size="12">P2</text><text x="380" y="70" font-size="12">w0 = area(X, P1, P2) / area(P0, P1, P2)</text><text x="380" y="88" font-size="12">   = ((P1 − X) × (P2 − X)) · n / (n · n)</text><text x="380" y="116" font-size="11.5" fill="#5c6270">n = (P1 − P0) × (P2 − P0) = (0, 4, 0),  n · n = 16</text><text x="380" y="144" font-size="12.5" font-weight="600">at X: w = (0.5, 0.25, 0.25)</text><text x="380" y="162" font-size="11.5" fill="#5c6270">red w0, green w1, blue w2: each is the</text><text x="380" y="178" font-size="11.5" fill="#5c6270">sub-triangle opposite that corner</text><text x="380" y="206" font-size="12">at (2, 0, −2): w = (-1, 1, 1)</text><text x="380" y="224" font-size="11.5" fill="#5c6270">a negative weight: outside that edge</text>
