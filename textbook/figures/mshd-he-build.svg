<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 186" width="820" height="186" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="820" height="186" fill="#ffffff"/>
<text x="58" y="68" font-size="17" text-anchor="end" font-weight="700" fill="#1f5fb0">t1</text><text x="58" y="150" font-size="17" text-anchor="end" font-weight="700" fill="#d98c1f">t2</text><rect x="70" y="40" width="124" height="44" rx="6" fill="#dfe9f7" stroke="#1f5fb0" stroke-width="1.6"/><text x="132" y="68" font-size="16" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">(1,3) → h3</text><rect x="220" y="40" width="124" height="44" rx="6" fill="#dfe9f7" stroke="#1f5fb0" stroke-width="1.6"/><text x="282" y="68" font-size="16" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">(3,4) → h4</text><rect x="370" y="40" width="124" height="44" rx="6" fill="#dfe9f7" stroke="#1f5fb0" stroke-width="1.6"/><text x="432" y="68" font-size="16" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">(4,1) → h5</text><rect x="70" y="122" width="124" height="44" rx="6" fill="#fbeedb" stroke="#d98c1f" stroke-width="1.6"/><text x="132" y="150" font-size="16" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">(1,4) → h6</text><rect x="220" y="122" width="124" height="44" rx="6" fill="#fbeedb" stroke="#d98c1f" stroke-width="1.6"/><text x="282" y="150" font-size="16" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">(4,2) → h7</text><rect x="370" y="122" width="124" height="44" rx="6" fill="#fbeedb" stroke="#d98c1f" stroke-width="1.6"/><text x="432" y="150" font-size="16" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">(2,1) → h8</text><line x1="432" y1="84" x2="143.9" y2="120.49" stroke="#6b40d8" stroke-width="2.8" /><polygon points="132,122 144.58,125.85 143.23,115.13" fill="#6b40d8"/><line x1="132" y1="122" x2="420.1" y2="85.51" stroke="#6b40d8" stroke-width="2.8" /><polygon points="432,84 419.42,80.15 420.77,90.87" fill="#6b40d8"/><text x="536" y="60" font-size="15" fill="#6b40d8" font-weight="600">reverse the key: (4,1) finds (1,4)</text><text x="536" y="82" font-size="15" fill="#6b40d8">so h5 and h6 are twins</text><text x="536" y="142" font-size="15" fill="#c0392b" font-weight="600">(2,1) finds no (1,2)</text><text x="536" y="164" font-size="15" fill="#c0392b">so h8 keeps twin −1</text>
