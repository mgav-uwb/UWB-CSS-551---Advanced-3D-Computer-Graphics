<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="640" height="340" fill="#ffffff"/>
<text x="20" y="24" fill="#1a1c22"  font-weight="600" font-size="14">P(t) = P0 + t d</text><text x="20" y="44" fill="#5c6270" font-size="12.5" >P0 = (1, 1),  d = (2, 1)</text><line x1="4.8" y1="314.6" x2="546" y2="44" stroke="#d7dbe3"  stroke-width="2"/><line x1="216" y1="209" x2="546" y2="44" stroke="#128a8a"  stroke-width="2" stroke-opacity="0.8"/><line x1="493.2" y1="70.4" x2="552" y2="41" stroke="#128a8a"  stroke-width="2"/><polygon points="561.84,36.08 554.22,45.43 549.79,36.57" fill="#128a8a"/><line x1="216" y1="209" x2="348" y2="143" stroke="#d98c1f"  stroke-width="7" stroke-linecap="round"/><line x1="87.13" y1="281.26" x2="80.87" y2="268.74" stroke="#1a1c22"  stroke-width="1.6"/><circle cx="84" cy="275" r="3.5" fill="#1a1c22"/><text x="94.73" y="300.47" fill="#1a1c22" font-size="12.5" text-anchor="middle" font-weight="600">t = −1</text><text x="94.73" y="314.47" fill="#5c6270" font-size="12.5" text-anchor="middle">(−1, 0)</text><line x1="219.13" y1="215.26" x2="212.87" y2="202.74" stroke="#1a1c22"  stroke-width="1.6"/><circle cx="216" cy="209" r="3.5" fill="#1a1c22"/><text x="226.73" y="234.47" fill="#1a1c22" font-size="12.5" text-anchor="middle" font-weight="600">t = 0</text><text x="226.73" y="248.47" fill="#5c6270" font-size="12.5" text-anchor="middle">(1, 1)</text><line x1="285.13" y1="182.26" x2="278.87" y2="169.74" stroke="#1a1c22"  stroke-width="1.6"/><circle cx="282" cy="176" r="3.5" fill="#1a1c22"/><text x="271.27" y="146.53" fill="#1a1c22" font-size="12.5" text-anchor="middle" font-weight="600">t = 0.5</text><text x="271.27" y="160.53" fill="#5c6270" font-size="12.5" text-anchor="middle">(2, 1.5)</text><line x1="351.13" y1="149.26" x2="344.87" y2="136.74" stroke="#1a1c22"  stroke-width="1.6"/><circle cx="348" cy="143" r="3.5" fill="#1a1c22"/><text x="337.27" y="113.53" fill="#1a1c22" font-size="12.5" text-anchor="middle" font-weight="600">t = 1</text><text x="337.27" y="127.53" fill="#5c6270" font-size="12.5" text-anchor="middle">(3, 2)</text><line x1="483.13" y1="83.26" x2="476.87" y2="70.74" stroke="#1a1c22"  stroke-width="1.6"/><circle cx="480" cy="77" r="3.5" fill="#1a1c22"/><text x="490.73" y="102.47" fill="#1a1c22" font-size="12.5" text-anchor="middle" font-weight="600">t = 2</text><text x="490.73" y="116.47" fill="#5c6270" font-size="12.5" text-anchor="middle">(5, 3)</text><line x1="400" y1="190" x2="440" y2="190" stroke="#d98c1f"  stroke-width="7" stroke-linecap="round"/><text x="450" y="194" fill="#1a1c22" font-size="12.5" >segment: 0 ≤ t ≤ 1</text><line x1="400" y1="216" x2="430" y2="216" stroke="#128a8a"  stroke-width="2"/><polygon points="440,216 430,220.5 430,211.5" fill="#128a8a"/><text x="450" y="220" fill="#1a1c22" font-size="12.5" >ray: t ≥ 0</text><line x1="400" y1="242" x2="440" y2="242" stroke="#d7dbe3"  stroke-width="2"/><text x="450" y="246" fill="#1a1c22" font-size="12.5" >line: any t</text><text x="400" y="276" fill="#5c6270" font-size="12.5" >t = 0 sits at P0</text><text x="400" y="294" fill="#5c6270" font-size="12.5" >t = 1 sits at P0 + d</text><text x="400" y="312" fill="#5c6270" font-size="12.5" >negative t runs backward</text>
</svg>
