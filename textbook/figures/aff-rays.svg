<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" width="640" height="322" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="640" height="322" fill="#ffffff"/>
<text x="40" y="24" font-weight="600" font-size="13">Points of a line, lifted to (x, w): every point is a ray through the origin</text><rect x="40" y="43.16" width="560" height="213.68" fill="none" stroke="#d7dbe3"/><line x1="40" y1="223.68" x2="600" y2="223.68" stroke="#8a8f9a" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="84.21" y1="256.84" x2="84.21" y2="43.16" stroke="#8a8f9a" stroke-width="0.8"/><line x1="40" y1="150" x2="600" y2="150" stroke="#1f5fb0" stroke-width="2.5"/><text x="44" y="142" font-size="12" fill="#1f5fb0" font-weight="600">w = 1: the points</text><text x="596" y="239.68" font-size="12" fill="#5c6270" text-anchor="end">w = 0: directions, never on the line</text><text x="90.21" y="55.16" font-size="12" fill="#5c6270" font-weight="600">w</text><text x="231.58" y="166" fill="#1f5fb0" font-size="10.5" text-anchor="middle">x = 2</text><text x="378.95" y="166" fill="#1f5fb0" font-size="10.5" text-anchor="middle">x = 4</text><text x="526.32" y="166" fill="#1f5fb0" font-size="10.5" text-anchor="middle">x = 6</text><line x1="84.21" y1="223.68" x2="437.89" y2="46.84" stroke="#1a1c22" stroke-width="1.6"/><circle cx="157.89" cy="186.84" r="4.5" fill="#1a1c22"/><text x="107.89" y="180.84" font-size="11.5">(1, 0.5)</text><circle cx="231.58" cy="150" r="4.5" fill="#1a1c22"/><text x="181.58" y="144" font-size="11.5">(2, 1)</text><circle cx="378.95" cy="76.32" r="4.5" fill="#1a1c22"/><text x="328.95" y="70.32" font-size="11.5">(4, 2)</text><text x="443.89" y="50.84" font-weight="600" font-size="11.5">all three: x / w = 2</text><line x1="231.58" y1="150" x2="231.58" y2="223.68" stroke="#d98c1f" stroke-width="1" stroke-dasharray="3 3"/><line x1="84.21" y1="223.68" x2="396.63" y2="145.58" stroke="#d98c1f" stroke-width="1.3"/><circle cx="231.58" cy="186.84" r="4" fill="#d98c1f"/><text x="224.58" y="184.84" fill="#d98c1f" font-size="11" text-anchor="end">(2, 0.5)</text><circle cx="378.95" cy="150" r="5" fill="#d98c1f"/><text x="378.95" y="140" fill="#d98c1f" font-weight="600" font-size="11" text-anchor="middle">(2, 0.5) lands here</text><line x1="84.21" y1="223.68" x2="552.84" y2="145.58" stroke="#d98c1f" stroke-width="1.3"/><circle cx="231.58" cy="199.12" r="4" fill="#d98c1f"/><text x="224.58" y="211.12" fill="#d98c1f" font-size="11" text-anchor="end">(2, 1/3)</text><circle cx="526.32" cy="150" r="5" fill="#d98c1f"/><text x="526.32" y="140" fill="#d98c1f" font-weight="600" font-size="11" text-anchor="middle">(2, 1/3) lands here</text><line x1="84.21" y1="223.68" x2="266.79" y2="223.68" stroke="#c0392b" stroke-width="2.5"/><polygon points="275.79,223.68 266.79,228.18 266.79,219.18" fill="#c0392b"/><text x="281.79" y="218.68" fill="#c0392b" font-weight="600" font-size="11.5">(2, 0): the direction +x</text><circle cx="84.21" cy="223.68" r="3.5" fill="#1a1c22"/><text x="40" y="292" font-size="12" fill="#1a1c22">(x, w) and (λx, λw) name one point, x / w: dividing by w slides along the ray to the line w = 1.</text><text x="40" y="310" font-size="12" fill="#5c6270">Shrinking w pushes the point out: (2, 0.5) is x = 4, (2, 1/3) is x = 6; (2, 0) never arrives.</text>
</svg>
