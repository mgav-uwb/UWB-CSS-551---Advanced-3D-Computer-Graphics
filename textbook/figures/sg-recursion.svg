<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="640" height="270" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1c22"/></marker></defs><text x="30" y="40" font-size="13" font-family="Menlo, monospace" fill="#1f5fb0">base.CompositeXform(I)</text><text x="30" y="64" font-size="13" font-family="Menlo, monospace" fill="#1a1c22">   W_base = I · L_base</text><text x="30" y="88" font-size="13" font-family="Menlo, monospace" fill="#1f5fb0">   arm.CompositeXform(W_base)</text><text x="30" y="112" font-size="13" font-family="Menlo, monospace" fill="#1a1c22">      W_arm = W_base · L_arm</text><text x="30" y="136" font-size="13" font-family="Menlo, monospace" fill="#1f5fb0">      hand.CompositeXform(W_arm)</text><text x="30" y="160" font-size="13" font-family="Menlo, monospace" fill="#1a1c22">         W_hand = W_arm · L_hand</text><text x="30" y="184" font-size="13" font-family="Menlo, monospace" fill="#1a1c22">         draw hand's primitives with W_hand</text><text x="30" y="208" font-size="13" font-family="Menlo, monospace" fill="#1a1c22">      draw arm's primitives with W_arm</text><text x="30" y="232" font-size="13" font-family="Menlo, monospace" fill="#1a1c22">   draw base's primitives with W_base</text><rect x="20" y="22" width="400" height="230" fill="none" stroke="#d7dbe3" rx="6"/><text x="440" y="60" font-size="12" fill="#5c6270">Depth first: a subtree finishes</text><text x="440" y="76" font-size="12" fill="#5c6270">before its sibling starts.</text><text x="440" y="106" font-size="12" fill="#5c6270">The parent product is passed</text><text x="440" y="122" font-size="12" fill="#5c6270">down by value, so siblings see</text><text x="440" y="138" font-size="12" fill="#5c6270">the same parent matrix.</text><text x="440" y="168" font-size="12" fill="#5c6270">The call stack IS the path</text><text x="440" y="184" font-size="12" fill="#5c6270">from the root to the node.</text>
</svg>
