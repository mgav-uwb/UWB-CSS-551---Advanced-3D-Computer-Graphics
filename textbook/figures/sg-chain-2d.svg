<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="640" height="330" fill="#ffffff"/>
<line x1="98.75" y1="30" x2="98.75" y2="290" stroke="#eceff4"/><line x1="180" y1="30" x2="180" y2="290" stroke="#eceff4"/><line x1="261.25" y1="30" x2="261.25" y2="290" stroke="#eceff4"/><line x1="50" y1="257.5" x2="310" y2="257.5" stroke="#eceff4"/><line x1="50" y1="176.25" x2="310" y2="176.25" stroke="#eceff4"/><line x1="50" y1="95" x2="310" y2="95" stroke="#eceff4"/><rect x="50" y="30" width="260" height="260" fill="none" stroke="#d7dbe3"/><text x="98.75" y="305" text-anchor="middle" fill="#5c6270" font-size="11">-1</text><text x="180" y="305" text-anchor="middle" fill="#5c6270" font-size="11">0</text><text x="261.25" y="305" text-anchor="middle" fill="#5c6270" font-size="11">1</text><text x="44" y="261.5" text-anchor="end" fill="#5c6270" font-size="11">-2</text><text x="44" y="180.25" text-anchor="end" fill="#5c6270" font-size="11">-1</text><text x="44" y="99" text-anchor="end" fill="#5c6270" font-size="11">0</text><text x="180" y="322" text-anchor="middle" fill="#5c6270">x</text><text transform="translate(10,160) rotate(-90)" text-anchor="middle" fill="#5c6270">z</text><text x="50" y="22" font-weight="600" font-size="13">Base yawed 90°, arm one unit out the base's x</text><circle cx="180" cy="95" r="6" fill="#1f5fb0" /><text x="188.13" y="66.56" font-size="11.5" fill="#1f5fb0">base at the origin</text><line x1="180" y1="95" x2="255.25" y2="95" stroke="#8a8f9a" stroke-width="1.5"/><polygon points="261.25,95 255.25,98.6 255.25,91.4" fill="#8a8f9a"/><text x="204.38" y="82.81" font-size="10.5" fill="#8a8f9a">local +x, no yaw</text><line x1="180" y1="95" x2="180" y2="169.25" stroke="#0a7d5a" stroke-width="2.5"/><polygon points="180,176.25 175.8,169.25 184.2,169.25" fill="#0a7d5a"/><text x="58.13" y="135.63" font-size="10.5" fill="#0a7d5a">local +x after R_y(90)</text><circle cx="180" cy="176.25" r="6" fill="#0a7d5a" /><text x="192.19" y="180.31" font-size="11.5" fill="#0a7d5a">arm origin (0, 0, -1)</text><polyline fill="none" stroke="#c0392b"  stroke-linejoin="round" stroke-width="6" stroke-linecap="round" stroke-opacity="0.6" points="180,176.25 180,257.5"/><circle cx="180" cy="257.5" r="6" fill="#c0392b" /><text x="192.19" y="261.56" font-size="11.5" fill="#c0392b">arm tip (0, 0, -2)</text><text x="335" y="70" font-size="13" font-weight="600">W_arm = R_y(90) · T(1, 0, 0)</text><text x="335" y="95" font-size="11.5">linear part R_y(90);</text><text x="335" y="111" font-size="11.5">translation R_y(90)·(1,0,0) = (0, 0, −1)</text><text x="335" y="141" font-size="11.5" fill="#5c6270">the arm's local offset (1, 0, 0) never</text><text x="335" y="157" font-size="11.5" fill="#5c6270">changed; its world position is the</text><text x="335" y="173" font-size="11.5" fill="#5c6270">parent's rotation applied to it</text><text x="335" y="203" font-size="11" fill="#5c6270">z runs down the page; a right-handed</text><text x="335" y="219" font-size="11" fill="#5c6270">turn about y sends +x toward −z</text>
</svg>
