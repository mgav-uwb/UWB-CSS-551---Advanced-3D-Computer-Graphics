<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 336" width="930" height="336" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="930" height="336" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="600">the pyramid on the rectangle, apex P</text><polygon points="148,60 114,300 312,261.1" fill="#1f5fb0" fill-opacity="0.08" stroke="#1f5fb0" stroke-width="1.6"/><polygon points="148,60 312,261.1 248,207.4" fill="#6b40d8" fill-opacity="0.08" stroke="#6b40d8" stroke-width="1.6"/><polygon points="148,60 248,207.4 51,246.3" fill="#128a8a" fill-opacity="0.08" stroke="#128a8a" stroke-width="1.6"/><polygon points="148,60 51,246.3 114,300" fill="#c2468a" fill-opacity="0.08" stroke="#c2468a" stroke-width="1.6"/><polygon points="148,260.2 114,300" fill="none" stroke="#8a8f9a" stroke-width="1.2" stroke-dasharray="4 3"/><polygon points="148,260.2 312,261.1" fill="none" stroke="#8a8f9a" stroke-width="1.2" stroke-dasharray="4 3"/><polygon points="148,260.2 248,207.4" fill="none" stroke="#8a8f9a" stroke-width="1.2" stroke-dasharray="4 3"/><polygon points="148,260.2 51,246.3" fill="none" stroke="#8a8f9a" stroke-width="1.2" stroke-dasharray="4 3"/><polygon points="114,300 312,261.1 248,207.4 51,246.3" fill="none" stroke="#1a1c22" stroke-width="3.4"/><line x1="148.14" y1="60" x2="148.14" y2="260.2" stroke="#d98c1f" stroke-width="1.4" stroke-dasharray="2 3"/><polygon points="148.14,260.2 148.14,260.2 148.14,260.2" fill="#d98c1f"/><circle cx="148.14" cy="60" r="5" fill="#d98c1f"/><text x="156.14" y="54" fill="#d98c1f" font-size="15" font-weight="600">P = (1, 1, 5)</text><circle cx="148.14" cy="260.2" r="3.5" fill="#d98c1f"/><line x1="191.27" y1="207.04" x2="230.04" y2="212.64" stroke="#1f5fb0" stroke-width="2.4"/><polygon points="238.95,213.92 229.4,217.09 230.69,208.18" fill="#1f5fb0"/><line x1="235.88" y1="176.18" x2="294.91" y2="124.65" stroke="#6b40d8" stroke-width="2.4"/><polygon points="301.69,118.73 297.87,128.04 291.95,121.26" fill="#6b40d8"/><line x1="148.88" y1="171.26" x2="106.09" y2="105.19" stroke="#128a8a" stroke-width="2.4"/><polygon points="101.2,97.64 109.86,102.75 102.31,107.64" fill="#128a8a"/><line x1="104.26" y1="202.11" x2="47.36" y2="194.09" stroke="#c2468a" stroke-width="2.4"/><polygon points="38.45,192.83 47.99,189.63 46.74,198.54" fill="#c2468a"/><text x="20" y="322" font-size="14" fill="#5c6270">rectangle at z = 2, 3 by 2; P is 3 above it</text><text x="360" y="28" font-size="15" font-weight="600">the side faces projected onto</text><text x="360" y="48" font-size="15" font-weight="600">the rectangle (seen from above)</text><polygon points="430,140 360,210 570,210" fill="#1f5fb0" fill-opacity="0.12" stroke="#1f5fb0" stroke-width="1.4"/><text x="453.33" y="192.27" font-size="15" font-weight="600" fill="#1f5fb0" text-anchor="middle">1.5</text><polygon points="430,140 570,210 570,70" fill="#6b40d8" fill-opacity="0.12" stroke="#6b40d8" stroke-width="1.4"/><text x="523.33" y="145.6" font-size="15" font-weight="600" fill="#6b40d8" text-anchor="middle">2</text><polygon points="430,140 570,70 360,70" fill="#128a8a" fill-opacity="0.12" stroke="#128a8a" stroke-width="1.4"/><text x="453.33" y="98.93" font-size="15" font-weight="600" fill="#128a8a" text-anchor="middle">1.5</text><polygon points="430,140 360,70 360,210" fill="#c2468a" fill-opacity="0.12" stroke="#c2468a" stroke-width="1.4"/><text x="383.33" y="145.6" font-size="15" font-weight="600" fill="#c2468a" text-anchor="middle">1</text><polygon points="360,210 570,210 570,70 360,70" fill="none" stroke="#1a1c22" stroke-width="3.4"/><circle cx="430" cy="140" r="4" fill="#d98c1f"/><text x="360" y="240" font-size="14" fill="#5c6270">shadow areas 1.5 + 2 + 1.5 + 1 = 6</text><text x="620" y="40" font-size="15" font-weight="600">(p_i − P) × (p_next − P)</text><text x="800" y="40" font-size="15" font-weight="600">length</text><text x="870" y="40" font-size="15" font-weight="600">· n</text><text x="620" y="70" font-size="14" fill="#1f5fb0">(0, -9, 3)</text><text x="800" y="70" font-size="14" fill="#1f5fb0">9.487</text><text x="870" y="70" font-size="14" fill="#1f5fb0">3</text><text x="620" y="96" font-size="14" fill="#6b40d8">(6, 0, 4)</text><text x="800" y="96" font-size="14" fill="#6b40d8">7.211</text><text x="870" y="96" font-size="14" fill="#6b40d8">4</text><text x="620" y="122" font-size="14" fill="#128a8a">(0, 9, 3)</text><text x="800" y="122" font-size="14" fill="#128a8a">9.487</text><text x="870" y="122" font-size="14" fill="#128a8a">3</text><text x="620" y="148" font-size="14" fill="#c2468a">(-6, 0, 2)</text><text x="800" y="148" font-size="14" fill="#c2468a">6.325</text><text x="870" y="148" font-size="14" fill="#c2468a">2</text><line x1="620" y1="160" x2="910" y2="160" stroke="#d7dbe3"/><text x="620" y="182" font-size="15" font-weight="600" fill="#0a7d5a">sum (0, 0, 12)</text><text x="870" y="182" font-size="15" font-weight="600" fill="#0a7d5a">12</text><text x="620" y="222" font-size="14" fill="#5c6270">length = 2 · the face’s area</text><text x="620" y="244" font-size="14" fill="#5c6270">· n = 2 · the face’s shadow</text><text x="620" y="284" font-size="15" font-weight="600" fill="#0a7d5a">sum · n = 12 = 2 · Area</text><text x="620" y="308" font-size="15" font-weight="600" fill="#0a7d5a">Area = 6</text>
</svg>
