 y2="84.31" stroke="#128a8a" stroke-width="2.2"/><polygon points="224.31,76.51 226.41,85.21 218.61,83.41" fill="#128a8a"/><line x1="237.4" y1="160.96" x2="287.26" y2="74.99" stroke="#c2468a" stroke-width="2.2"/><polygon points="291.28,68.07 290.72,77 283.8,72.98" fill="#c2468a"/><text x="20" y="340" font-size="14" fill="#5c6270">each cross is normal to its own tilted triangle</text><text x="370" y="28" font-size="15" font-weight="600">the five crosses, tip to tail</text><line x1="589.76" y1="292.6" x2="460.42" y2="60" stroke="#8a8f9a" stroke-width="1.2" stroke-dasharray="5 4"/><polygon points="460.42,60 460.42,60 460.42,60" fill="#8a8f9a"/><line x1="578.98" y1="273.22" x2="539.22" y2="282.9" stroke="#1f5fb0" stroke-width="2.4"/><polygon points="530.48,285.03 538.16,278.53 540.29,287.27" fill="#1f5fb0"/><line x1="530.48" y1="285.03" x2="446.97" y2="312.21" stroke="#c0392b" stroke-width="2.4"/><polygon points="438.41,315 445.58,307.94 448.36,316.49" fill="#c0392b"/><line x1="438.41" y1="315" x2="415.22" y2="271.15" stroke="#6b40d8" stroke-width="2.4"/><polygon points="411.02,263.19 419.2,269.05 411.24,273.25" fill="#6b40d8"/><line x1="411.02" y1="263.19" x2="425.16" y2="202" stroke="#128a8a" stroke-width="2.4"/><polygon points="427.18,193.23 429.54,203.01 420.77,200.99" fill="#128a8a"/><line x1="427.18" y1="193.23" x2="477.46" y2="106.55" stroke="#c2468a" stroke-width="2.4"/><polygon points="481.97,98.77 481.35,108.81 473.57,104.29" fill="#c2468a"/><line x1="578.98" y1="273.22" x2="487.81" y2="109.25" stroke="#0a7d5a" stroke-width="3.2"/><polygon points="481.97,98.77 493.05,106.34 482.56,112.17" fill="#0a7d5a"/><text x="489.97" y="102.77" fill="#0a7d5a" font-size="15" font-weight="600">sum</text><text x="395.81" y="59.69" font-size="14" fill="#8a8f9a">the normal line</text><text x="370" y="340" font-size="14" fill="#5c6270">the sum lands on the normal line</text><text x="650" y="28" font-size="15" font-weight="600">o = (3, 3, 3),  n = (1, 2, 2) / 3</text><text x="650" y="58" font-size="14">(p_i − o) × (p_next − o)</text><text x="870" y="58" font-size="14">· n</text><text x="650" y="84" font-size="14" fill="#1f5fb0">(3, -3, 6)</text><text x="870" y="84" font-size="14" fill="#1f5fb0">3</text><text x="650" y="108" font-size="14" fill="#c0392b">(7, -4, 5)</text><text x="870" y="108" font-size="14" fill="#c0392b">3</text><text x="650" y="132" font-size="14" fill="#6b40d8">(3, 6, -3)</text><text x="870" y="132" font-size="14" fill="#6b40d8">3</text><text x="650" y="156" font-size="14" fill="#128a8a">(-1, 7, -2)</text><text x="870" y="156" font-size="14" fill="#128a8a">3</text><text x="650" y="180" font-size="14" fill="#c2468a">(-6, 6, 6)</text><text x="870" y="180" font-size="14" fill="#c2468a">6</text><line x1="650" y1="192" x2="910" y2="192" stroke="#d7dbe3"/><text x="650" y="212" font-size="15" font-weight="600" fill="#0a7d5a">sum (6, 12, 12)</text><text x="870" y="212" font-size="15" font-weight="600" fill="#0a7d5a">18</text><text x="650" y="260" font-size="15" font-weight="600" fill="#0a7d5a">sum · n = 18 = 2 · Area</text><text x="650" y="284" font-size="15" font-weight="600" fill="#0a7d5a">Area = 9</text><text x="650" y="318" font-size="14" fill="#5c6270">each · n is twice the shadow of its</text><text x="650" y="340" font-size="14" fill="#5c6270">triangle, from o's foot (2, 1, 1)</text>
