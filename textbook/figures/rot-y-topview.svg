ove: z right, x up</text><line x1="460" y1="200" x2="573" y2="200" stroke="#1f5fb0" stroke-width="2"/><polygon points="580,200 573,203.5 573,196.5" fill="#1f5fb0"/><text x="586" y="196" fill="#1f5fb0" font-size="12.5" font-weight="600" >z</text><line x1="460" y1="200" x2="460" y2="87" stroke="#c0392b" stroke-width="2"/><polygon points="460,80 463.5,87 456.5,87" fill="#c0392b"/><text x="466" y="76" fill="#c0392b" font-size="12.5" font-weight="600" >x</text><line x1="460" y1="200" x2="557.86" y2="143.5" stroke="#1f5fb0" stroke-width="2" stroke-dasharray="5 3"/><polygon points="563.92,140 559.61,146.53 556.11,140.47" fill="#1f5fb0"/><text x="569.92" y="136" fill="#1f5fb0" font-size="12.5" font-weight="600" >z'</text><line x1="460" y1="200" x2="403.5" y2="102.14" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/><polygon points="400,96.08 406.53,100.39 400.47,103.89" fill="#c0392b"/><text x="384" y="92.08" fill="#c0392b" font-size="12.5" font-weight="600" >x'</text><polyline fill="none" stroke="#1a1c22" stroke-width="1.5" points="526,200 525.99,198.92 525.96,197.84 525.92,196.76 525.86,195.68 525.78,194.61 525.68,193.53 525.57,192.46 525.44,191.39 525.29,190.32 525.12,189.25 524.93,188.18 524.73,187.12 524.51,186.07 524.28,185.01 524.02,183.96 523.75,182.92 523.46,181.88 523.16,180.84 522.84,179.81 522.5,178.78 522.14,177.77 521.77,176.75 521.38,175.74 520.98,174.74 520.55,173.75 520.12,172.76 519.66,171.78 519.19,170.81 518.71,169.84"/><line x1="518.71" y1="169.84" x2="520.03" y2="172.27" stroke="#1a1c22" stroke-width="1.5"/><polygon points="517.16,167 522.66,170.83 517.4,173.7" fill="#1a1c22"/><text x="534.4" y="185.6" font-size="12" >30°</text><text x="340" y="262" font-size="12" fill="#c0392b">x lands at (0.866, 0, −0.5): x tips toward −z</text><text x="340" y="280" font-size="12" fill="#1f5fb0">z lands at (0.5, 0, 0.866): z tips toward +x</text><text x="340" y="298" font-size="12" fill="#5c6270">so R_y has +sin θ top right, −sin θ bottom left</text><text x=