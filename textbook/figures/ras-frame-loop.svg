<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1a1c22">
<rect width="640" height="230" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1c22"/></marker></defs><rect x="20" y="30" width="140" height="40" rx="6" fill="#8a8f9a" fill-opacity="0.12" stroke="#8a8f9a" stroke-width="1.4"/><text x="90" y="54" text-anchor="middle" font-weight="600" font-size="12" fill="#8a8f9a">read input</text><line x1="160" y1="50" x2="170" y2="50" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><rect x="170" y="30" width="140" height="40" rx="6" fill="#1f5fb0" fill-opacity="0.12" stroke="#1f5fb0" stroke-width="1.4"/><text x="240" y="54" text-anchor="middle" font-weight="600" font-size="12" fill="#1f5fb0">update the model</text><line x1="310" y1="50" x2="320" y2="50" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><rect x="320" y="30" width="140" height="40" rx="6" fill="#0a7d5a" fill-opacity="0.12" stroke="#0a7d5a" stroke-width="1.4"/><text x="390" y="54" text-anchor="middle" font-weight="600" font-size="12" fill="#0a7d5a">render (pipeline)</text><line x1="460" y1="50" x2="470" y2="50" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><rect x="470" y="30" width="140" height="40" rx="6" fill="#c0392b" fill-opacity="0.12" stroke="#c0392b" stroke-width="1.4"/><text x="540" y="54" text-anchor="middle" font-weight="600" font-size="12" fill="#c0392b">present (swap)</text><path d="M 610 70 V 90 H 90 V 72" fill="none" stroke="#1a1c22" stroke-width="1.3" marker-end="url(#ah)"/><text x="320" y="106" text-anchor="middle" font-size="12">again, 60 times a second: 16.7 ms per lap</text><text x="20" y="132" font-size="12" font-weight="600">double buffering, three refresh periods (16.7 ms each):</text><rect x="20" y="140" width="196" height="26" fill="#0a7d5a" fill-opacity="0.15" stroke="#0a7d5a"/><text x="118" y="157" text-anchor="middle" font-size="11">monitor shows front buffer 0</text><rect x="20" y="172" width="150" height="26" fill="#1f5fb0" fill-opacity="0.15" stroke="#1f5fb0"/><text x="95" y="189" text-anchor="middle" font-size="11">GPU draws frame 1 into the back</text><line x1="216" y1="136" x2="216" y2="202" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 2"/><text x="216" y="216" text-anchor="middle" font-size="10" fill="#c0392b">swap at v-sync</text><rect x="220" y="140" width="196" height="26" fill="#0a7d5a" fill-opacity="0.15" stroke="#0a7d5a"/><text x="318" y="157" text-anchor="middle" font-size="11">monitor shows front buffer 1</text><rect x="220" y="172" width="150" height="26" fill="#1f5fb0" fill-opacity="0.15" stroke="#1f5fb0"/><text x="295" y="189" text-anchor="middle" font-size="11">GPU draws frame 2 into the back</text><line x1="416" y1="136" x2="416" y2="202" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 2"/><text x="416" y="216" text-anchor="middle" font-size="10" fill="#c0392b">swap at v-sync</text><rect x="420" y="140" width="196" height="26" fill="#0a7d5a" fill-opacity="0.15" stroke="#0a7d5a"/><text x="518" y="157" text-anchor="middle" font-size="11">monitor shows front buffer 2</text><rect x="420" y="172" width="150" height="26" fill="#1f5fb0" fill-opacity="0.15" stroke="#1f5fb0"/><text x="495" y="189" text-anchor="middle" font-size="11">GPU draws frame 3 into the back</text><line x1="616" y1="136" x2="616" y2="202" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 2"/><text x="616" y="216" text-anchor="end" font-size="10" fill="#c0392b">swap at v-sync</text>
</svg>
