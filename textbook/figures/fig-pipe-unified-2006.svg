<text x="22" y="26" font-size="14" font-weight="700">Era 7: unified shaders and GPU compute</text><text x="22" y="46" font-size="11.5" fill="#5c6270">NVIDIA GeForce 8800 GTX, 2006: 128 unified stream processors, $599; CUDA 2007</text><rect x="22" y="78" width="134" height="64" rx="7" fill="#e3e5ea" stroke="#8a8f9a" stroke-width="1.6" /><text x="89" y="100" text-anchor="middle" font-size="11.5" font-weight="700" >application</text><text x="89" y="118" text-anchor="middle" font-size="10.5" fill="#5c6270">draw and dispatch</text><text x="89" y="131" text-anchor="middle" font-size="10.5" fill="#5c6270">calls</text><line x1="158" y1="110" x2="166" y2="110" stroke="#1a1c22" stroke-width="1.4"/><polygon points="170,110 164,106 164,114" fill="#1a1c22"/><rect x="172" y="78" width="134" height="64" rx="7" fill="#fbe3c7" stroke="#d98c1f" stroke-width="1.6" /><text x="239" y="100" text-anchor="middle" font-size="11.5" font-weight="700" >geometry, vertex</text><text x="239" y="118" text-anchor="middle" font-size="10.5" fill="#5c6270">vertex shader, unified</text><text x="239" y="131" text-anchor="middle" font-size="10.5" fill="#5c6270">pool</text><line x1="308" y1="110" x2="316" y2="110" stroke="#1a1c22" stroke-width="1.4"/><polygon points="320,110 314,106 314,114" fill="#1a1c22"/><rect x="322" y="78" width="134" height="64" rx="7" fill="#d6e4f7" stroke="#1f5fb0" stroke-width="1.6" /><text x="389" y="100" text-anchor="middle" font-size="11.5" font-weight="700" >clip and project</text><text x="389" y="118" text-anchor="middle" font-size="10.5" fill="#5c6270">clip, divide, viewport</text><line x1="458" y1="110" x2="466" y2="110" stroke="#1a1c22" stroke-width="1.4"/><polygon points="470,110 464,106 464,114" fill="#1a1c22"/><rect x="472" y="78" width="134" height="64" rx="7" fill="#d6e4f7" stroke="#1f5fb0" stroke-width="1.6" /><text x="539" y="100" text-anchor="middle" font-size="11.5" font-weight="700" >rasterize</text><text x="539" y="118" text-anchor="middle" font-size="10.5" fill="#5c6270">setup, scan conversion</text><line x1="608" y1="110" x2="616" y2="110" stroke="#1a1c22" stroke-width="1.4"/><polygon points="620,110 614,106 614,114" fill="#1a1c22"/><rect x="622" y="78" width="134" height="64" rx="7" fill="#fbe3c7" stroke="#d98c1f" stroke-width="1.6" /><text x="689" y="100" text-anchor="middle" font-size="11.5" font-weight="700" >fragment, pixel</text><text x="689" y="118" text-anchor="middle" font-size="10.5" fill="#5c6270">pixel shader, same</text><text x="689" y="131" text-anchor="middle" font-size="10.5" fill="#5c6270">pool</text><line x1="758" y1="110" x2="766" y2="110" stroke="#1a1c22" stroke-width="1.4"/><polygon points="770,110 764,106 764,114" fill="#1a1c22"/><rect x="772" y="78" width="134" height="64" rx="7" fill="#d6e4f7" stroke="#1f5fb0" stroke-width="1.6" /><text x="839" y="100" text-anchor="middle" font-size="11.5" font-weight="700" >frame buffer, display</text><text x="839" y="118" text-anchor="middle" font-size="10.5" fill="#5c6270">z, blend, scan-out</text><line x1="89" y1="142" x2="89" y2="176" stroke="#d98c1f" stroke-dasharray="3 3"/><rect x="22" y="176" width="150.4" height="46" rx="7" fill="#fbe3c7" stroke="#d98c1f" stroke-width="1.6"/><text x="97.2" y="195" text-anchor="middle" font-size="11" font-weight="700">compute (CUDA, 2007)</text><text x="97.2" y="211" text-anchor="middle" font-size="10" fill="#5c6270">same processor pool</text><line x1="389" y1="142" x2="389" y2="176" stroke="#d98c1f" stroke-dasharray="3 3"/><rect x="322" y="176" width="134" height="46" rx="7" fill="#fbe3c7" stroke="#d98c1f" stroke-width="1.6"/><text x="389" y="195" text-anchor="middle" font-size="11" font-weight="700">geometry shader</text><text x="389" y="211" text-anchor="middle" font-size="10" fill="#5c6270">Direct3D 10</text><rect x="22" y="268" width="16" height="12" rx="2" fill="#e3e5ea" stroke="#8a8f9a" /><text x="44" y="278" font-size="11">host software (CPU)</text><rect x="183.8" y="268" width="16" height="12" rx="2" fill="#d6e4f