ill="#5c6270">50 Hz</text><text x="20" y="240" font-size="10.5" fill="#5c6270">six frames of 16.7 ms carry five fixed steps of 20 ms: five frames run one FixedUpdate, the first runs none;</text><text x="20" y="256" font-size="10.5" fill="#5c6270">Time.deltaTime is the frame length, Time.fixedDeltaTime the step length</text>
