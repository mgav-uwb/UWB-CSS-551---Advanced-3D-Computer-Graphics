<text x="20" y="24" fill="#1a1c22"  font-weight="600" font-size="14">Gram-Schmidt: subtract the shadow, keep the rest</text><text x="20" y="44" fill="#5c6270" font-size="12.5" >Drawn in the plane of a and b (e1 horizontal, e2 vertical).</text><line x1="177" y1="310" x2="496" y2="310" stroke="#d7dbe3"  stroke-width="1"/><line x1="210" y1="310" x2="448.97" y2="310" stroke="#8a8f9a"  stroke-width="1.2"/><polygon points="455.97,310 448.97,313.15 448.97,306.85" fill="#8a8f9a"/><text x="463.97" y="314" fill="#8a8f9a" font-size="12.5" >a = (2, 1, 0)</text><line x1="210" y1="310" x2="400.2" y2="132.08" stroke="#1f5fb0"  stroke-width="2.2"/><polygon points="406.77,125.93 402.97,135.04 397.43,129.13" fill="#1f5fb0"/><text x="416.77" y="121.93" fill="#1f5fb0" font-size="12.5" font-weight="600">b = (1, 2, 1)</text><line x1="210" y1="310" x2="396.77" y2="310" stroke="#d98c1f"  stroke-width="4.5"/><polygon points="406.77,310 396.77,314.5 396.77,305.5" fill="#d98c1f"/><line x1="210" y1="324" x2="311" y2="324" stroke="#6b40d8"  stroke-width="2.2"/><polygon points="320,324 311,328.05 311,319.95" fill="#6b40d8"/><text x="212" y="342" fill="#6b40d8" font-size="12.5" font-weight="600">e1 = a / |a| = (0.894, 0.447, 0)</text><line x1="210" y1="368" x2="406.77" y2="368" stroke="#d98c1f"  stroke-width="1.5"/><line x1="210" y1="363" x2="210" y2="373" stroke="#d98c1f" stroke-width="1.5" /><line x1="406.77" y1="363" x2="406.77" y2="373" stroke="#d98c1f" stroke-width="1.5" /><line x1="406.77" y1="310" x2="406.77" y2="368" stroke="#d98c1f"  stroke-dasharray="2 3" stroke-width="1"/><text x="212" y="386" fill="#d98c1f" font-size="12.5" font-weight="600">shadow = (b · e1) e1 = 1.789 e1</text><line x1="406.77" y1="310" x2="406.77" y2="135.93" stroke="#c0392b"  stroke-width="3"/><polygon points="406.77,125.93 411.27,135.93 402.27,135.93" fill="#c0392b"/><polyline fill="none" stroke="#1a1c22" stroke-width="1.2" points="394.77,310 394.77,298 406.77,298"/><text x="416.77" y="211.97" fill="#c0392b" font-size="12.5" font-weight="600">b − (b · e1) e1</text><text x="416.77" y="227.97" fill="#c0392b" font-size="12.5" >= (−0.6, 1.2, 1)</text><text x="416.77" y="243.97" fill="#c0392b" font-size="12.5" >length 1.673</text><line x1="210" y1="310" x2="210" y2="209" stroke="#6b40d8"  stroke-width="2.2"/><polygon points="210,200 214.05,209 205.95,209" fill="#6b40d8"/><text x="202" y="172" fill="#6b40d8" font-size="12.5" font-weight="600" text-anchor="end">e2 = remainder / length</text><text x="202" y="190" fill="#6b40d8" font-size="12.5" text-anchor="end">(−0.359, 0.717, 0.598)</text><text x="202" y="250" fill="#5c6270" font-size="12.5" text-anchor="end">e1 · e2 = 0</text><circle cx="210" cy="310" r="3.5" fill="#1a1c22"/>
