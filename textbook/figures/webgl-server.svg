<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1c22"/></marker><marker id="ahd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5c6270"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f5fb0"/></marker><marker id="aha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0a7d5a"/></marker></defs><rect x="20" y="40" width="180" height="64" rx="6" fill="#1a1c22" fill-opacity="0.12" stroke="#1a1c22" stroke-width="1.4"/><text x="110" y="70" text-anchor="middle" font-weight="600" font-size="12" fill="#1a1c22">the course folder</text><text x="110" y="85" text-anchor="middle" font-size="10.5" fill="#5c6270">css551/ on your disk</text><text x="30" y="128" font-family="ui-monospace, Menlo, monospace" font-size="11" >css551/</text><text x="30" y="146" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5c6270">  homework/run.html</text><text x="30" y="162" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5c6270">  lib/core/xform.js</text><text x="30" y="178" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5c6270">  lib/skeletons/hw01.js</text><text x="30" y="194" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5c6270">  lib/vendor/three.module.js</text><rect x="262" y="40" width="170" height="64" rx="6" fill="#0a7d5a" fill-opacity="0.12" stroke="#0a7d5a" stroke-width="1.4"/><text x="347" y="70" text-anchor="middle" font-weight="600" font-size="12" fill="#0a7d5a">a static server</text><text x="347" y="85" text-anchor="middle" font-size="10.5" fill="#5c6270">python3 -m http.server 8000</text><line x1="200" y1="72" x2="260" y2="72" stroke="#0a7d5a" stroke-width="1.4" marker-end="url(#aha)" /><text x="230" y="64" text-anchor="middle" font-size="10" fill="#5c6270">reads</text><rect x="500" y="40" width="180" height="64" rx="6" fill="#1f5fb0" fill-opacity="0.12" stroke="#1f5fb0" stroke-width="1.4"/><text x="590" y="70" text-anchor="middle" font-weight="600" font-size="12" fill="#1f5fb0">the browser</text><text x="590" y="85" text-anchor="middle" font-size="10.5" fill="#5c6270">http://localhost:8000/…</text><line x1="432" y1="66" x2="498" y2="66" stroke="#0a7d5a" stroke-width="1.4" marker-end="url(#aha)" /><line x1="498" y1="82" x2="432" y2="82" stroke="#1f5fb0" stroke-width="1.4" marker-end="url(#ahb)" /><text x="466" y="60" text-anchor="middle" font-size="10" fill="#5c6270">files</text><text x="466" y="98" text-anchor="middle" font-size="10" fill="#5c6270">requests</text><text x="500" y="128" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1f5fb0">run.html</text><text x="510" y="146" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5c6270">import … from</text><text x="510" y="162" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5c6270">'../lib/skeletons/runner.js'</text><text x="510" y="178" font-family="ui-monospace, Menlo, monospace"  fill="#5c6270" font-size="10">resolved against run.html’s URL</text><rect x="262" y="200" width="440" height="70" rx="6" fill="#c0392b" fill-opacity="0.07" stroke="#c0392b" stroke-dasharray="5 4"/><text x="272" y="222" font-size="11.5" font-weight="600" fill="#c0392b">file:///…/run.html, opened directly: the page’s origin is “null”</text><text x="272" y="242" font-size="10.5" fill="#5c6270">and the browser refuses every module import from it (a CORS error).</text><text x="272" y="258" font-size="10.5" fill="#5c6270">Serve the folder; never double-click the page.</text>
